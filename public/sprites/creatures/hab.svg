<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Opsros — brick rhino, warm terracotta -->
  <ellipse cx="24" cy="44" rx="12" ry="2" fill="#000" opacity="0.3"/>
  <!-- Tail -->
  <rect x="4" y="26" width="8" height="4" fill="#a06028"/>
  <rect x="3" y="24" width="4" height="4" fill="#a06028"/>
  <!-- Body - brick armored -->
  <rect x="8" y="22" width="32" height="16" fill="#c47833"/>
  <!-- Brick texture on body -->
  <rect x="8" y="25" width="32" height="1" fill="#8a4820" opacity="0.6"/>
  <rect x="8" y="29" width="32" height="1" fill="#8a4820" opacity="0.6"/>
  <rect x="8" y="33" width="32" height="1" fill="#8a4820" opacity="0.6"/>
  <rect x="12" y="23" width="1" height="3" fill="#8a4820" opacity="0.5"/>
  <rect x="20" y="23" width="1" height="3" fill="#8a4820" opacity="0.5"/>
  <rect x="28" y="23" width="1" height="3" fill="#8a4820" opacity="0.5"/>
  <rect x="16" y="26" width="1" height="3" fill="#8a4820" opacity="0.5"/>
  <rect x="24" y="26" width="1" height="3" fill="#8a4820" opacity="0.5"/>
  <rect x="32" y="26" width="1" height="3" fill="#8a4820" opacity="0.5"/>
  <!-- Belly lighter -->
  <rect x="18" y="28" width="12" height="6" fill="#d4904a"/>
  <!-- 4 legs -->
  <rect x="10" y="36" width="6" height="8" fill="#a06028"/>
  <rect x="18" y="36" width="6" height="8" fill="#a06028"/>
  <rect x="26" y="36" width="6" height="8" fill="#a06028"/>
  <rect x="34" y="36" width="6" height="8" fill="#a06028"/>
  <!-- Hooves -->
  <rect x="10" y="42" width="6" height="2" fill="#5a2c10"/>
  <rect x="18" y="42" width="6" height="2" fill="#5a2c10"/>
  <rect x="26" y="42" width="6" height="2" fill="#5a2c10"/>
  <rect x="34" y="42" width="6" height="2" fill="#5a2c10"/>
  <!-- Head -->
  <rect x="32" y="18" width="14" height="12" fill="#c47833"/>
  <rect x="32" y="18" width="14" height="2" fill="#a06028"/>
  <!-- Snout -->
  <rect x="42" y="22" width="5" height="6" fill="#b46828"/>
  <!-- Horn -->
  <rect x="44" y="18" width="3" height="6" fill="#e8e0c0"/>
  <rect x="45" y="16" width="2" height="3" fill="#d8d0b0"/>
  <rect x="46" y="14" width="1" height="3" fill="#c8c0a0"/>
  <!-- Eye (small window) -->
  <rect x="34" y="20" width="4" height="4" fill="#f5d24a" opacity="0.8"/>
  <rect x="35" y="21" width="2" height="2" fill="#3a2010"/>
  <!-- Nostril -->
  <rect x="43" y="25" width="2" height="1" fill="#6a3010"/>
  <!-- Shine on body -->
  <rect x="10" y="23" width="6" height="2" fill="#d4904a" opacity="0.5"/>
</svg>
