<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Crawlix — web crawler spider-robot, forest green -->
  <ellipse cx="24" cy="42" rx="9" ry="2" fill="#000" opacity="0.25"/>
  <!-- 6 legs (3 per side) -->
  <!-- Left legs -->
  <rect x="4" y="16" width="10" height="2" fill="#5a8a4a"/>
  <rect x="3" y="14" width="2" height="4" fill="#4a7a3a"/>
  <rect x="4" y="22" width="10" height="2" fill="#5a8a4a"/>
  <rect x="3" y="20" width="2" height="4" fill="#4a7a3a"/>
  <rect x="4" y="28" width="10" height="2" fill="#5a8a4a"/>
  <rect x="3" y="26" width="2" height="4" fill="#4a7a3a"/>
  <!-- Right legs -->
  <rect x="34" y="16" width="10" height="2" fill="#5a8a4a"/>
  <rect x="43" y="14" width="2" height="4" fill="#4a7a3a"/>
  <rect x="34" y="22" width="10" height="2" fill="#5a8a4a"/>
  <rect x="43" y="20" width="2" height="4" fill="#4a7a3a"/>
  <rect x="34" y="28" width="10" height="2" fill="#5a8a4a"/>
  <rect x="43" y="26" width="2" height="4" fill="#4a7a3a"/>
  <!-- Body carapace -->
  <rect x="12" y="14" width="24" height="20" fill="#7ac46a"/>
  <rect x="12" y="14" width="24" height="2" fill="#5aa04a"/>
  <rect x="12" y="32" width="24" height="2" fill="#4a8a3a"/>
  <!-- Shell segments -->
  <rect x="14" y="16" width="20" height="1" fill="#5aa04a" opacity="0.5"/>
  <rect x="14" y="19" width="20" height="1" fill="#5aa04a" opacity="0.5"/>
  <rect x="14" y="22" width="20" height="1" fill="#5aa04a" opacity="0.5"/>
  <rect x="14" y="25" width="20" height="1" fill="#5aa04a" opacity="0.5"/>
  <rect x="14" y="28" width="20" height="1" fill="#5aa04a" opacity="0.5"/>
  <!-- Head -->
  <rect x="16" y="10" width="16" height="6" fill="#8ad47a"/>
  <rect x="16" y="10" width="16" height="1" fill="#6ab85a"/>
  <!-- Eyes (6 compound eyes) -->
  <rect x="17" y="11" width="3" height="3" fill="#f5d24a"/>
  <rect x="17" y="11" width="1" height="1" fill="#000"/>
  <rect x="22" y="11" width="3" height="3" fill="#f5d24a"/>
  <rect x="22" y="11" width="1" height="1" fill="#000"/>
  <rect x="27" y="11" width="3" height="3" fill="#f5d24a"/>
  <rect x="27" y="11" width="1" height="1" fill="#000"/>
  <!-- Price tag on body -->
  <rect x="16" y="20" width="8" height="5" fill="#f5d24a"/>
  <rect x="17" y="21" width="6" height="1" fill="#3a2010"/>
  <rect x="17" y="23" width="4" height="1" fill="#3a2010"/>
  <!-- Data cable antennae -->
  <rect x="19" y="7" width="1" height="4" fill="#4a7a3a"/>
  <rect x="28" y="7" width="1" height="4" fill="#4a7a3a"/>
  <rect x="18" y="6" width="3" height="2" fill="#7ac46a"/>
  <rect x="27" y="6" width="3" height="2" fill="#7ac46a"/>
  <!-- Body shine -->
  <rect x="14" y="15" width="4" height="2" fill="#9ae480" opacity="0.6"/>
</svg>
