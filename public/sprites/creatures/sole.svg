<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Sneakynx — hot pink streetwear lynx -->
  <ellipse cx="24" cy="45" rx="10" ry="2" fill="#000" opacity="0.3"/>
  <!-- Tail curling up left -->
  <rect x="4" y="28" width="10" height="3" fill="#e870b0"/>
  <rect x="4" y="22" width="3" height="8" fill="#e870b0"/>
  <rect x="5" y="20" width="5" height="4" fill="#e870b0"/>
  <!-- Body -->
  <rect x="12" y="24" width="24" height="18" fill="#ff9fd4"/>
  <!-- Belly white -->
  <rect x="16" y="28" width="16" height="10" fill="#fff" opacity="0.7"/>
  <!-- Fur detail lines -->
  <rect x="14" y="26" width="1" height="14" fill="#e870b0" opacity="0.4"/>
  <rect x="33" y="26" width="1" height="14" fill="#e870b0" opacity="0.4"/>
  <!-- 4 legs with SNEAKER feet -->
  <rect x="12" y="40" width="8" height="6" fill="#ff9fd4"/>
  <rect x="28" y="40" width="8" height="6" fill="#ff9fd4"/>
  <!-- Sneaker feet left front -->
  <rect x="10" y="44" width="12" height="4" fill="#ffffff"/>
  <rect x="10" y="47" width="12" height="1" fill="#1a1a1a"/>
  <rect x="11" y="44" width="9" height="2" fill="#ff9fd4"/>
  <!-- Sneaker feet right front -->
  <rect x="26" y="44" width="12" height="4" fill="#ffffff"/>
  <rect x="26" y="47" width="12" height="1" fill="#1a1a1a"/>
  <rect x="27" y="44" width="9" height="2" fill="#ff9fd4"/>
  <!-- Head -->
  <rect x="16" y="12" width="16" height="14" fill="#ff9fd4"/>
  <!-- Tall pointy ears -->
  <rect x="16" y="6" width="4" height="8" fill="#ff9fd4"/>
  <rect x="17" y="7" width="2" height="5" fill="#e870b0"/>
  <rect x="28" y="6" width="4" height="8" fill="#ff9fd4"/>
  <rect x="29" y="7" width="2" height="5" fill="#e870b0"/>
  <!-- Eyes - sharp squinting -->
  <rect x="18" y="16" width="5" height="3" fill="#1a1a1a"/>
  <rect x="18" y="16" width="5" height="1" fill="#333"/>
  <rect x="19" y="17" width="3" height="1" fill="#2a1a3a"/>
  <rect x="25" y="16" width="5" height="3" fill="#1a1a1a"/>
  <rect x="25" y="16" width="5" height="1" fill="#333"/>
  <rect x="26" y="17" width="3" height="1" fill="#2a1a3a"/>
  <!-- Nose -->
  <rect x="22" y="21" width="4" height="2" fill="#e870b0"/>
  <!-- Whiskers -->
  <rect x="12" y="20" width="6" height="1" fill="#fff" opacity="0.6"/>
  <rect x="30" y="20" width="6" height="1" fill="#fff" opacity="0.6"/>
  <!-- Brand logo marking on chest -->
  <rect x="19" y="29" width="10" height="6" fill="#e870b0" opacity="0.5"/>
  <rect x="21" y="30" width="6" height="1" fill="#fff" opacity="0.7"/>
  <rect x="21" y="32" width="4" height="1" fill="#fff" opacity="0.7"/>
  <!-- Gold chain necklace -->
  <rect x="17" y="25" width="14" height="1" fill="#f5d24a" opacity="0.8"/>
  <rect x="23" y="25" width="2" height="2" fill="#f5d24a"/>
</svg>
