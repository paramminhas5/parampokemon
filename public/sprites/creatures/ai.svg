<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Bottoflux — AI chatbot, electric cyan -->
  <!-- Glow aura -->
  <circle cx="24" cy="28" r="16" fill="#9fe8ff" opacity="0.1"/>
  <ellipse cx="24" cy="44" rx="10" ry="2" fill="#000" opacity="0.25"/>
  <!-- Floating hands -->
  <rect x="4" y="22" width="6" height="4" fill="#9fe8ff" opacity="0.8"/>
  <rect x="3" y="20" width="4" height="2" fill="#7cc8e8"/>
  <rect x="38" y="22" width="6" height="4" fill="#9fe8ff" opacity="0.8"/>
  <rect x="41" y="20" width="4" height="2" fill="#7cc8e8"/>
  <!-- Interface windows on hands -->
  <rect x="4" y="22" width="5" height="3" fill="#3a78d8" opacity="0.6"/>
  <rect x="39" y="22" width="5" height="3" fill="#3a78d8" opacity="0.6"/>
  <!-- Body - circuit trace -->
  <rect x="16" y="28" width="16" height="14" fill="#1a2a4a"/>
  <rect x="16" y="28" width="16" height="1" fill="#9fe8ff"/>
  <rect x="16" y="40" width="16" height="1" fill="#9fe8ff" opacity="0.5"/>
  <!-- Circuit lines on body -->
  <rect x="18" y="31" width="12" height="1" fill="#9fe8ff" opacity="0.5"/>
  <rect x="18" y="34" width="8" height="1" fill="#00e8a0" opacity="0.7"/>
  <rect x="18" y="37" width="10" height="1" fill="#9fe8ff" opacity="0.4"/>
  <rect x="26" y="28" width="1" height="12" fill="#3a78d8" opacity="0.4"/>
  <!-- Chat message window on chest -->
  <rect x="18" y="30" width="12" height="9" fill="#0a1828"/>
  <rect x="18" y="30" width="12" height="1" fill="#3a78d8"/>
  <rect x="19" y="32" width="10" height="1" fill="#9fe8ff" opacity="0.8"/>
  <rect x="19" y="34" width="8" height="1" fill="#9fe8ff" opacity="0.6"/>
  <rect x="19" y="36" width="6" height="1" fill="#9fe8ff" opacity="0.4"/>
  <!-- Head - faceted crystal -->
  <rect x="14" y="12" width="20" height="18" fill="#2a3a5a"/>
  <!-- Head facets -->
  <rect x="14" y="12" width="20" height="2" fill="#3a78d8"/>
  <rect x="14" y="28" width="20" height="2" fill="#3a78d8" opacity="0.5"/>
  <rect x="14" y="12" width="2" height="18" fill="#3a5a8a" opacity="0.7"/>
  <rect x="32" y="12" width="2" height="18" fill="#3a5a8a" opacity="0.7"/>
  <!-- Eyes - glowing cyan -->
  <rect x="17" y="16" width="5" height="5" fill="#9fe8ff"/>
  <rect x="18" y="17" width="3" height="3" fill="#7ce0ff"/>
  <rect x="18" y="17" width="1" height="1" fill="#fff"/>
  <rect x="26" y="16" width="5" height="5" fill="#9fe8ff"/>
  <rect x="27" y="17" width="3" height="3" fill="#7ce0ff"/>
  <rect x="27" y="17" width="1" height="1" fill="#fff"/>
  <!-- Antenna -->
  <rect x="22" y="8" width="2" height="5" fill="#9fe8ff"/>
  <rect x="20" y="7" width="6" height="2" fill="#7ce0ff"/>
  <rect x="23" y="6" width="2" height="2" fill="#00e8a0"/>
  <!-- Legs -->
  <rect x="18" y="40" width="4" height="6" fill="#1a2a4a"/>
  <rect x="26" y="40" width="4" height="6" fill="#1a2a4a"/>
  <rect x="18" y="44" width="4" height="2" fill="#3a78d8" opacity="0.8"/>
  <rect x="26" y="44" width="4" height="2" fill="#3a78d8" opacity="0.8"/>
</svg>
