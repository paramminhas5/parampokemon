<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Agentwisp — autonomous AI agent, neon green wisp -->
  <!-- Outer glow -->
  <circle cx="24" cy="24" r="18" fill="#00e8a0" opacity="0.08"/>
  <circle cx="24" cy="24" r="12" fill="#00e8a0" opacity="0.1"/>
  <ellipse cx="24" cy="44" rx="8" ry="2" fill="#000" opacity="0.2"/>
  <!-- Flowing light body - translucent humanoid -->
  <!-- Waist/lower body wisps -->
  <rect x="18" y="30" width="12" height="8" fill="#00e8a0" opacity="0.7"/>
  <!-- Wisp tendrils bottom -->
  <rect x="16" y="36" width="4" height="6" fill="#00e8a0" opacity="0.5"/>
  <rect x="20" y="38" width="3" height="5" fill="#00e8a0" opacity="0.4"/>
  <rect x="25" y="38" width="3" height="5" fill="#00e8a0" opacity="0.4"/>
  <rect x="28" y="36" width="4" height="6" fill="#00e8a0" opacity="0.5"/>
  <!-- Torso -->
  <rect x="17" y="20" width="14" height="12" fill="#00e8a0" opacity="0.8"/>
  <!-- Terminal window on chest -->
  <rect x="18" y="21" width="12" height="9" fill="#021a10"/>
  <rect x="18" y="21" width="12" height="1" fill="#00e8a0"/>
  <rect x="19" y="23" width="8" height="1" fill="#9fffd0" opacity="0.9"/>
  <rect x="19" y="25" width="6" height="1" fill="#00e8a0" opacity="0.8"/>
  <rect x="19" y="27" width="4" height="1" fill="#9fffd0" opacity="0.6"/>
  <!-- Arms floating -->
  <rect x="6" y="20" width="12" height="4" fill="#00e8a0" opacity="0.6"/>
  <rect x="6" y="18" width="6" height="4" fill="#00e8a0" opacity="0.4"/>
  <rect x="30" y="20" width="12" height="4" fill="#00e8a0" opacity="0.6"/>
  <rect x="36" y="18" width="6" height="4" fill="#00e8a0" opacity="0.4"/>
  <!-- Head -->
  <rect x="16" y="10" width="16" height="12" fill="#00e8a0" opacity="0.85"/>
  <!-- Head outline -->
  <rect x="16" y="10" width="16" height="1" fill="#9fffd0"/>
  <rect x="16" y="21" width="16" height="1" fill="#9fffd0" opacity="0.5"/>
  <!-- Eyes - data stream green -->
  <rect x="18" y="13" width="5" height="4" fill="#9fffd0"/>
  <rect x="19" y="14" width="3" height="2" fill="#021a10"/>
  <rect x="19" y="14" width="1" height="1" fill="#00e8a0"/>
  <rect x="25" y="13" width="5" height="4" fill="#9fffd0"/>
  <rect x="26" y="14" width="3" height="2" fill="#021a10"/>
  <rect x="26" y="14" width="1" height="1" fill="#00e8a0"/>
  <!-- Orbiting crypto tokens -->
  <rect x="6" y="14" width="4" height="4" fill="#f5d24a" opacity="0.8"/>
  <rect x="7" y="15" width="2" height="2" fill="#c0a020"/>
  <rect x="38" y="10" width="4" height="4" fill="#9fffd0" opacity="0.7"/>
  <rect x="39" y="11" width="2" height="2" fill="#00e8a0"/>
  <rect x="10" y="36" width="4" height="4" fill="#00e8a0" opacity="0.5"/>
  <rect x="34" y="34" width="4" height="4" fill="#f5d24a" opacity="0.6"/>
  <!-- Floating code symbols above head -->
  <rect x="19" y="6" width="2" height="3" fill="#00e8a0" opacity="0.6"/>
  <rect x="23" y="5" width="2" height="3" fill="#9fffd0" opacity="0.5"/>
  <rect x="27" y="6" width="2" height="3" fill="#00e8a0" opacity="0.4"/>
</svg>
