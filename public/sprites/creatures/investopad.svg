<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Capitalcon — deal-flow falcon, deep purple + gold -->
  <ellipse cx="24" cy="45" rx="8" ry="2" fill="#000" opacity="0.3"/>
  <!-- Left wing (spread) -->
  <rect x="2" y="18" width="14" height="4" fill="#6a2888"/>
  <rect x="2" y="22" width="12" height="3" fill="#7a3898"/>
  <rect x="4" y="25" width="10" height="2" fill="#5a1878"/>
  <!-- Wing feather tips left -->
  <rect x="2" y="16" width="3" height="4" fill="#5a1878"/>
  <rect x="6" y="14" width="3" height="6" fill="#5a1878"/>
  <rect x="10" y="16" width="3" height="5" fill="#5a1878"/>
  <!-- Right wing (spread) -->
  <rect x="32" y="18" width="14" height="4" fill="#6a2888"/>
  <rect x="34" y="22" width="12" height="3" fill="#7a3898"/>
  <rect x="34" y="25" width="10" height="2" fill="#5a1878"/>
  <!-- Wing feather tips right -->
  <rect x="43" y="16" width="3" height="4" fill="#5a1878"/>
  <rect x="39" y="14" width="3" height="6" fill="#5a1878"/>
  <rect x="35" y="16" width="3" height="5" fill="#5a1878"/>
  <!-- Wing bar chart patterns -->
  <rect x="4" y="19" width="2" height="2" fill="#f0c4ff" opacity="0.5"/>
  <rect x="7" y="18" width="2" height="3" fill="#f0c4ff" opacity="0.5"/>
  <rect x="10" y="20" width="2" height="1" fill="#f0c4ff" opacity="0.5"/>
  <rect x="34" y="20" width="2" height="1" fill="#f0c4ff" opacity="0.5"/>
  <rect x="37" y="18" width="2" height="3" fill="#f0c4ff" opacity="0.5"/>
  <rect x="40" y="19" width="2" height="2" fill="#f0c4ff" opacity="0.5"/>
  <!-- Body -->
  <rect x="16" y="18" width="16" height="22" fill="#8030a8"/>
  <rect x="16" y="18" width="16" height="2" fill="#6a2090"/>
  <!-- Belly gold -->
  <rect x="19" y="24" width="10" height="12" fill="#f0c4ff" opacity="0.3"/>
  <!-- Head -->
  <rect x="18" y="10" width="12" height="10" fill="#7028a0"/>
  <rect x="18" y="10" width="12" height="2" fill="#5a1888"/>
  <!-- Eyes - sharp golden -->
  <rect x="19" y="13" width="4" height="4" fill="#f5d24a"/>
  <rect x="20" y="14" width="2" height="2" fill="#3a2010"/>
  <rect x="20" y="14" width="1" height="1" fill="#fff"/>
  <rect x="25" y="13" width="4" height="4" fill="#f5d24a"/>
  <rect x="26" y="14" width="2" height="2" fill="#3a2010"/>
  <rect x="26" y="14" width="1" height="1" fill="#fff"/>
  <!-- Beak -->
  <rect x="22" y="18" width="4" height="3" fill="#f5d24a"/>
  <rect x="23" y="20" width="2" height="2" fill="#c0a020"/>
  <!-- Coin in talons -->
  <rect x="21" y="38" width="6" height="6" fill="#f5d24a"/>
  <circle cx="24" cy="41" r="2" fill="#c0a020"/>
  <rect x="23" y="40" width="2" height="1" fill="#f5d24a"/>
  <!-- Tail feathers -->
  <rect x="19" y="38" width="3" height="6" fill="#5a1878"/>
  <rect x="26" y="38" width="3" height="6" fill="#5a1878"/>
  <!-- Gold tip feathers -->
  <rect x="4" y="27" width="2" height="2" fill="#f5d24a" opacity="0.7"/>
  <rect x="42" y="27" width="2" height="2" fill="#f5d24a" opacity="0.7"/>
</svg>
