<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" shape-rendering="crispEdges">
  <!-- Discocat — golden DJ cat with headphones + vinyl -->
  <ellipse cx="24" cy="45" rx="9" ry="2" fill="#000" opacity="0.3"/>
  <!-- Tail curling right and up -->
  <rect x="34" y="28" width="8" height="3" fill="#c8a050"/>
  <rect x="38" y="22" width="3" height="8" fill="#c8a050"/>
  <rect x="36" y="20" width="5" height="4" fill="#c8a050"/>
  <!-- Body sitting pose -->
  <rect x="14" y="26" width="20" height="18" fill="#ffd29a"/>
  <!-- Belly lighter -->
  <rect x="17" y="30" width="14" height="10" fill="#ffe8b8"/>
  <!-- Front paws -->
  <rect x="14" y="40" width="6" height="5" fill="#ffd29a"/>
  <rect x="28" y="40" width="6" height="5" fill="#ffd29a"/>
  <!-- Toe beans -->
  <rect x="14" y="44" width="2" height="1" fill="#e8a870"/>
  <rect x="17" y="44" width="2" height="1" fill="#e8a870"/>
  <rect x="28" y="44" width="2" height="1" fill="#e8a870"/>
  <rect x="31" y="44" width="2" height="1" fill="#e8a870"/>
  <!-- Head -->
  <rect x="16" y="12" width="16" height="16" fill="#ffd29a"/>
  <!-- Pointed cat ears -->
  <rect x="15" y="6" width="5" height="8" fill="#ffd29a"/>
  <rect x="16" y="7" width="3" height="5" fill="#f0a880"/>
  <rect x="28" y="6" width="5" height="8" fill="#ffd29a"/>
  <rect x="29" y="7" width="3" height="5" fill="#f0a880"/>
  <!-- DJ Headphones -->
  <rect x="13" y="12" width="22" height="4" fill="#1a1a1a"/>
  <rect x="13" y="14" width="4" height="6" fill="#1a1a1a"/>
  <rect x="31" y="14" width="4" height="6" fill="#1a1a1a"/>
  <rect x="12" y="14" width="6" height="6" fill="#2a2a2a"/>
  <rect x="30" y="14" width="6" height="6" fill="#2a2a2a"/>
  <!-- Headphone cushion colors -->
  <rect x="13" y="15" width="4" height="4" fill="#ffd29a" opacity="0.4"/>
  <rect x="31" y="15" width="4" height="4" fill="#ffd29a" opacity="0.4"/>
  <!-- Eyes - half-lidded -->
  <rect x="18" y="20" width="4" height="3" fill="#1a1a1a"/>
  <rect x="18" y="20" width="4" height="1" fill="#333"/>
  <rect x="26" y="20" width="4" height="3" fill="#1a1a1a"/>
  <rect x="26" y="20" width="4" height="1" fill="#333"/>
  <!-- Nose + whiskers -->
  <rect x="22" y="24" width="4" height="2" fill="#f0a880"/>
  <rect x="14" y="23" width="7" height="1" fill="#c8a050" opacity="0.5"/>
  <rect x="27" y="23" width="7" height="1" fill="#c8a050" opacity="0.5"/>
  <!-- Vinyl record embedded in body -->
  <circle cx="24" cy="34" r="6" fill="#0a0a0a"/>
  <circle cx="24" cy="34" r="3" fill="#ffd29a"/>
  <circle cx="24" cy="34" r="1" fill="#0a0a0a"/>
  <!-- Record shine -->
  <rect x="19" y="29" width="2" height="1" fill="#2a2a2a" opacity="0.7"/>
  <!-- Music note above head -->
  <rect x="32" y="8" width="2" height="5" fill="#ffd29a" opacity="0.8"/>
  <rect x="32" y="8" width="4" height="2" fill="#ffd29a" opacity="0.8"/>
  <rect x="34" y="8" width="2" height="4" fill="#ffd29a" opacity="0.8"/>
</svg>
