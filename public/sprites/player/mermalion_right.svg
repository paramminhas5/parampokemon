<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="48" height="64" fill="none"/>
  <!-- MERMALION right side view (mirror of left) -->
  <!-- Tail fin sweeping right -->
  <rect x="30" y="48" width="18" height="10" fill="#8a60c8"/>
  <rect x="36" y="52" width="12" height="10" fill="#7050b8"/>
  <rect x="40" y="56" width="8" height="6" fill="#5a3aa0"/>
  <rect x="44" y="60" width="4" height="2" fill="#4a2a90"/>
  <!-- Fin highlights -->
  <rect x="36" y="49" width="8" height="3" fill="#b890e8" opacity="0.6"/>
  <!-- Tail body side -->
  <rect x="16" y="44" width="24" height="10" fill="#9a70d8"/>
  <rect x="16" y="38" width="20" height="8" fill="#9a70d8"/>
  <rect x="16" y="32" width="18" height="8" fill="#9a70d8"/>
  <rect x="16" y="26" width="16" height="8" fill="#9a70d8"/>
  <!-- Dorsal fin right side -->
  <rect x="14" y="22" width="8" height="18" fill="#7050b8"/>
  <rect x="14" y="16" width="7" height="10" fill="#8060c0"/>
  <rect x="14" y="12" width="6" height="6" fill="#9070c8"/>
  <rect x="14" y="8" width="5" height="6" fill="#b890e8"/>
  <!-- Belly from right side -->
  <rect x="26" y="28" width="10" height="16" fill="#e8d8ff"/>
  <!-- Body right side -->
  <rect x="10" y="20" width="24" height="14" fill="#c89af0"/>
  <rect x="30" y="22" width="6" height="12" fill="#e8d8ff"/>
  <!-- Body shading -->
  <rect x="10" y="20" width="2" height="14" fill="#a878d8"/>
  <rect x="32" y="20" width="2" height="14" fill="#a878d8"/>
  <!-- Flowing mane right side -->
  <rect x="32" y="10" width="10" height="14" fill="#5030a0"/>
  <rect x="36" y="12" width="8" height="12" fill="#4020a0"/>
  <rect x="40" y="14" width="6" height="10" fill="#3a10a0"/>
  <!-- Mane trail behind (on left of sprite going right) -->
  <rect x="2" y="18" width="8" height="10" fill="#6040a8"/>
  <rect x="2" y="20" width="6" height="8" fill="#5030a0"/>
  <!-- Right arm fin -->
  <rect x="32" y="22" width="10" height="6" fill="#a878d8"/>
  <rect x="40" y="24" width="6" height="5" fill="#9068c0"/>
  <!-- Neck -->
  <rect x="20" y="16" width="10" height="6" fill="#b888e8"/>
  <!-- Head side facing right -->
  <rect x="12" y="2" width="26" height="18" fill="#c89af0"/>
  <!-- Head shading -->
  <rect x="36" y="2" width="2" height="18" fill="#a878d8"/>
  <!-- Mane on head right side -->
  <rect x="32" y="2" width="8" height="14" fill="#5030a0"/>
  <rect x="36" y="4" width="6" height="12" fill="#4020a0"/>
  <!-- Face visible (left side facing right) -->
  <rect x="12" y="4" width="8" height="14" fill="#c89af0"/>
  <!-- White belly/chin -->
  <rect x="14" y="12" width="12" height="8" fill="#e8d8ff"/>
  <!-- Crest fin top right side -->
  <rect x="20" y="0" width="6" height="4" fill="#9a70d8"/>
  <rect x="21" y="-2" width="4" height="4" fill="#b890e8"/>
  <!-- Eye (facing right, left eye visible) -->
  <rect x="11" y="5" width="7" height="7" fill="#ffffff"/>
  <rect x="12" y="6" width="5" height="5" fill="#4a1a8a"/>
  <rect x="13" y="7" width="3" height="3" fill="#6030a0"/>
  <rect x="14" y="8" width="1" height="1" fill="#3a1070"/>
  <rect x="12" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="16" y="10" width="1" height="1" fill="#ffffff"/>
  <!-- Eyelash hint -->
  <rect x="12" y="4" width="2" height="1" fill="#5030a0"/>
  <rect x="16" y="4" width="2" height="1" fill="#5030a0"/>
  <!-- Nose side -->
  <rect x="10" y="13" width="3" height="2" fill="#a878d8"/>
  <!-- Mouth side -->
  <rect x="10" y="16" width="5" height="2" fill="#8a60b8"/>
  <!-- Forehead gem side -->
  <rect x="19" y="4" width="3" height="3" fill="#f0c0ff"/>
  <!-- Slight variation - magical sparkle -->
  <rect x="40" y="8" width="2" height="2" fill="#f0c0ff" opacity="0.7"/>
  <rect x="44" y="12" width="2" height="2" fill="#f0c0ff" opacity="0.5"/>
</svg>
