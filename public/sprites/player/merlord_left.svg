<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="48" height="64" fill="none"/>
  <!-- MERLORD left side view -->
  <!-- Magnificent tail fin sweeping left -->
  <rect x="0" y="46" width="20" height="14" fill="#d4a000"/>
  <rect x="0" y="50" width="14" height="12" fill="#c08000"/>
  <rect x="0" y="54" width="10" height="8" fill="#a06000"/>
  <rect x="0" y="58" width="6" height="4" fill="#806000"/>
  <!-- Fin highlights -->
  <rect x="2" y="46" width="10" height="5" fill="#ffd840"/>
  <rect x="0" y="51" width="6" height="5" fill="#f5d24a"/>
  <!-- Tail body side -->
  <rect x="8" y="42" width="26" height="10" fill="#d4a800"/>
  <rect x="10" y="36" width="24" height="8" fill="#d4a800"/>
  <rect x="12" y="30" width="22" height="8" fill="#d4a800"/>
  <rect x="14" y="24" width="20" height="8" fill="#d4a800"/>
  <!-- Tail highlight -->
  <rect x="24" y="24" width="4" height="18" fill="#ffd840" opacity="0.3"/>
  <!-- Cape from left side - sweeping back dramatically -->
  <rect x="20" y="10" width="28" height="40" fill="#a02020"/>
  <rect x="22" y="12" width="26" height="38" fill="#c03030"/>
  <rect x="44" y="12" width="4" height="38" fill="#d04040"/>
  <rect x="20" y="10" width="4" height="40" fill="#8a1010"/>
  <!-- Cape folds from side -->
  <rect x="26" y="14" width="2" height="34" fill="#b02020" opacity="0.5"/>
  <rect x="36" y="16" width="2" height="32" fill="#c03030" opacity="0.4"/>
  <!-- DORSAL FIN - massive from side -->
  <rect x="24" y="20" width="10" height="22" fill="#b87800"/>
  <rect x="25" y="14" width="9" height="10" fill="#c89000"/>
  <rect x="26" y="8" width="8" height="8" fill="#d4a000"/>
  <rect x="27" y="4" width="7" height="6" fill="#ffd840"/>
  <rect x="28" y="2" width="5" height="4" fill="#f5d24a"/>
  <rect x="29" y="0" width="3" height="4" fill="#fff070"/>
  <!-- Dorsal fin edge highlight -->
  <rect x="24" y="20" width="2" height="22" fill="#ffd840" opacity="0.7"/>
  <!-- Belly from side -->
  <rect x="12" y="22" width="12" height="16" fill="#fff8e0"/>
  <!-- Body side -->
  <rect x="14" y="16" width="26" height="14" fill="#d4a800"/>
  <rect x="12" y="18" width="6" height="12" fill="#fff8e0"/>
  <!-- Body shading -->
  <rect x="14" y="16" width="3" height="14" fill="#b88800"/>
  <!-- Shoulder pauldron from side - impressive -->
  <rect x="8" y="14" width="10" height="10" fill="#c89000"/>
  <rect x="6" y="16" width="8" height="8" fill="#b87800"/>
  <rect x="4" y="18" width="6" height="6" fill="#a06800"/>
  <!-- Pauldron spike -->
  <rect x="4" y="14" width="4" height="4" fill="#ffd840"/>
  <rect x="2" y="12" width="4" height="4" fill="#f5d24a"/>
  <!-- Arm fin extending left -->
  <rect x="4" y="20" width="12" height="6" fill="#c89000"/>
  <rect x="0" y="22" width="6" height="5" fill="#b87800"/>
  <!-- Neck -->
  <rect x="16" y="12" width="12" height="6" fill="#c89000"/>
  <rect x="16" y="12" width="12" height="2" fill="#ffd840"/>
  <!-- HEAD facing left -->
  <rect x="8" y="0" width="26" height="14" fill="#d4a800"/>
  <!-- Head shading -->
  <rect x="8" y="0" width="2" height="14" fill="#b88800"/>
  <!-- Face area (right side of head facing left) -->
  <rect x="26" y="2" width="8" height="10" fill="#d4a800"/>
  <!-- Belly under chin -->
  <rect x="20" y="8" width="14" height="6" fill="#fff8e0"/>
  <!-- Crown from side -->
  <rect x="10" y="0" width="24" height="3" fill="#f5d24a"/>
  <!-- Crown spikes side view - biggest center one visible -->
  <rect x="18" y="-4" width="7" height="5" fill="#f5d24a"/>
  <rect x="19" y="-6" width="5" height="4" fill="#ffd840"/>
  <rect x="20" y="-8" width="3" height="4" fill="#fff070"/>
  <!-- Front spike partial -->
  <rect x="28" y="-2" width="5" height="3" fill="#f5d24a"/>
  <!-- Crown gems side -->
  <rect x="20" y="0" width="3" height="2" fill="#c03030"/>
  <!-- Eye facing left (right eye visible) -->
  <rect x="28" y="2" width="6" height="8" fill="#ffffff"/>
  <rect x="29" y="3" width="5" height="6" fill="#8a6000"/>
  <rect x="30" y="4" width="4" height="4" fill="#c8a000"/>
  <rect x="31" y="5" width="2" height="2" fill="#ffd840"/>
  <rect x="29" y="3" width="2" height="2" fill="#ffffff"/>
  <rect x="33" y="8" width="1" height="1" fill="#ffffff"/>
  <!-- Eye outline -->
  <rect x="28" y="2" width="6" height="1" fill="#1a0a00"/>
  <rect x="28" y="9" width="6" height="1" fill="#1a0a00"/>
  <!-- Commanding brow side -->
  <rect x="27" y="1" width="8" height="2" fill="#8a5800"/>
  <!-- Nose side -->
  <rect x="33" y="9" width="3" height="2" fill="#b88800"/>
  <!-- Mouth side -->
  <rect x="31" y="11" width="5" height="2" fill="#a07800"/>
  <!-- Aura particles -->
  <rect x="0" y="34" width="3" height="2" fill="#ffd840" opacity="0.4"/>
  <rect x="0" y="28" width="2" height="2" fill="#ffd840" opacity="0.3"/>
</svg>
