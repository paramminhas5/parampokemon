<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="48" height="64" fill="none"/>
  <!-- MERLORD back view with flowing cape dominant -->
  <!-- Massive tail fin from behind -->
  <rect x="0" y="50" width="18" height="12" fill="#d4a000"/>
  <rect x="30" y="50" width="18" height="12" fill="#d4a000"/>
  <rect x="0" y="54" width="12" height="8" fill="#c08000"/>
  <rect x="36" y="54" width="12" height="8" fill="#c08000"/>
  <rect x="0" y="58" width="8" height="4" fill="#a06000"/>
  <rect x="40" y="58" width="8" height="4" fill="#a06000"/>
  <!-- Center tail notch -->
  <rect x="16" y="58" width="16" height="4" fill="#c08000"/>
  <!-- Tail fin highlights -->
  <rect x="2" y="50" width="10" height="4" fill="#ffd840"/>
  <rect x="34" y="50" width="10" height="4" fill="#ffd840"/>
  <!-- Inner tail gold -->
  <rect x="8" y="52" width="16" height="8" fill="#f5d24a"/>
  <rect x="24" y="52" width="16" height="8" fill="#f5d24a"/>
  <!-- Tail body -->
  <rect x="10" y="44" width="28" height="10" fill="#d4a800"/>
  <rect x="12" y="38" width="24" height="8" fill="#d4a800"/>
  <!-- CAPE - from behind, filling most of back, dramatic -->
  <!-- Cape shadow depth -->
  <rect x="2" y="12" width="44" height="44" fill="#8a1010" opacity="0.4"/>
  <!-- Cape main -->
  <rect x="4" y="10" width="40" height="44" fill="#c03030"/>
  <!-- Cape shading/folds -->
  <rect x="4" y="10" width="5" height="44" fill="#d04040"/>
  <rect x="39" y="10" width="5" height="44" fill="#9a1818"/>
  <rect x="10" y="12" width="28" height="40" fill="#a02020"/>
  <!-- Cape fold lines -->
  <rect x="16" y="14" width="2" height="38" fill="#c03030" opacity="0.7"/>
  <rect x="24" y="12" width="2" height="40" fill="#b02020" opacity="0.5"/>
  <rect x="32" y="14" width="2" height="36" fill="#c83030" opacity="0.4"/>
  <!-- Cape bottom flowing edge -->
  <rect x="4" y="50" width="40" height="4" fill="#9a1818"/>
  <rect x="6" y="52" width="36" height="2" fill="#8a1010"/>
  <!-- Cape clasp on shoulders - gold -->
  <rect x="8" y="10" width="6" height="4" fill="#f5d24a"/>
  <rect x="34" y="10" width="6" height="4" fill="#f5d24a"/>
  <!-- Body through cape (slight visibility) -->
  <rect x="14" y="14" width="20" height="18" fill="#c89800" opacity="0.3"/>
  <!-- Prominent dorsal fin from back -->
  <rect x="18" y="28" width="12" height="16" fill="#b87800"/>
  <rect x="19" y="22" width="10" height="10" fill="#c89000"/>
  <rect x="20" y="16" width="8" height="8" fill="#d4a000"/>
  <rect x="21" y="12" width="6" height="6" fill="#ffd840"/>
  <rect x="22" y="8" width="4" height="6" fill="#f5d24a"/>
  <rect x="23" y="6" width="2" height="4" fill="#fff070"/>
  <!-- Dorsal fin highlight edge -->
  <rect x="18" y="28" width="2" height="16" fill="#ffd840" opacity="0.7"/>
  <!-- Back of shoulders -->
  <rect x="4" y="12" width="12" height="10" fill="#c89000" opacity="0.5"/>
  <rect x="32" y="12" width="12" height="10" fill="#c89000" opacity="0.5"/>
  <!-- Neck back -->
  <rect x="18" y="8" width="12" height="6" fill="#c89000"/>
  <rect x="18" y="8" width="12" height="2" fill="#ffd840"/>
  <!-- Head back view -->
  <rect x="10" y="0" width="28" height="10" fill="#d4a800"/>
  <rect x="10" y="0" width="2" height="10" fill="#b88800"/>
  <rect x="36" y="0" width="2" height="10" fill="#b88800"/>
  <!-- Crown from back -->
  <rect x="10" y="0" width="28" height="3" fill="#f5d24a"/>
  <!-- Crown spikes back view -->
  <rect x="10" y="-4" width="6" height="6" fill="#f5d24a"/>
  <rect x="11" y="-5" width="4" height="3" fill="#ffd840"/>
  <rect x="20" y="-6" width="8" height="7" fill="#f5d24a"/>
  <rect x="21" y="-8" width="6" height="6" fill="#ffd840"/>
  <rect x="22" y="-9" width="4" height="4" fill="#fff070"/>
  <rect x="32" y="-4" width="6" height="6" fill="#f5d24a"/>
  <rect x="33" y="-5" width="4" height="3" fill="#ffd840"/>
  <!-- Crown gems back -->
  <rect x="13" y="0" width="2" height="2" fill="#c03030"/>
  <rect x="22" y="-1" width="4" height="2" fill="#c03030"/>
  <rect x="33" y="0" width="2" height="2" fill="#c03030"/>
  <!-- Back of head highlight -->
  <rect x="12" y="2" width="10" height="4" fill="#ffd840" opacity="0.3"/>
</svg>
