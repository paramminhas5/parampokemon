<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="48" height="64" fill="none"/>
  <!-- MERMALION - medium evolved form, purple, front view -->
  <!-- Large tail fin - more impressive than mermander -->
  <rect x="4" y="52" width="14" height="8" fill="#8a60c8"/>
  <rect x="30" y="52" width="14" height="8" fill="#8a60c8"/>
  <rect x="2" y="55" width="10" height="7" fill="#7050b8"/>
  <rect x="36" y="55" width="10" height="7" fill="#7050b8"/>
  <!-- Tail fin tips -->
  <rect x="0" y="58" width="6" height="4" fill="#5a3aa0"/>
  <rect x="42" y="58" width="6" height="4" fill="#5a3aa0"/>
  <!-- Tail fin highlights -->
  <rect x="5" y="53" width="6" height="3" fill="#b890e8"/>
  <rect x="33" y="53" width="6" height="3" fill="#b890e8"/>
  <!-- Bottom tail glow -->
  <rect x="8" y="57" width="32" height="3" fill="#c89af0" opacity="0.3"/>
  <!-- Tail body -->
  <rect x="12" y="46" width="24" height="10" fill="#9a70d8"/>
  <rect x="14" y="40" width="20" height="8" fill="#9a70d8"/>
  <!-- Tail scales -->
  <rect x="14" y="46" width="4" height="3" fill="#8a60c8"/>
  <rect x="20" y="48" width="4" height="3" fill="#8a60c8"/>
  <rect x="26" y="46" width="4" height="3" fill="#8a60c8"/>
  <rect x="16" y="50" width="4" height="3" fill="#8a60c8"/>
  <rect x="24" y="50" width="4" height="3" fill="#8a60c8"/>
  <!-- Scale highlights -->
  <rect x="14" y="46" width="2" height="1" fill="#c89af0"/>
  <rect x="20" y="48" width="2" height="1" fill="#c89af0"/>
  <rect x="26" y="46" width="2" height="1" fill="#c89af0"/>
  <!-- Tail mid -->
  <rect x="16" y="36" width="16" height="8" fill="#9a70d8"/>
  <!-- White/light belly -->
  <rect x="18" y="28" width="12" height="12" fill="#e8d8ff"/>
  <rect x="16" y="32" width="16" height="8" fill="#e8d8ff"/>
  <!-- Body - purple -->
  <rect x="12" y="24" width="24" height="20" fill="#c89af0"/>
  <!-- Body shading -->
  <rect x="12" y="24" width="2" height="20" fill="#a878d8"/>
  <rect x="34" y="24" width="2" height="20" fill="#a878d8"/>
  <!-- Body highlights -->
  <rect x="14" y="26" width="5" height="10" fill="#d8aaff" opacity="0.6"/>
  <!-- Flowing mane - dark purple around head/shoulders -->
  <!-- Left mane flowing down -->
  <rect x="6" y="18" width="10" height="16" fill="#6040a8"/>
  <rect x="4" y="20" width="8" height="14" fill="#5030a0"/>
  <rect x="2" y="22" width="6" height="10" fill="#4020a0"/>
  <!-- Right mane flowing down -->
  <rect x="32" y="18" width="10" height="16" fill="#6040a8"/>
  <rect x="38" y="20" width="8" height="14" fill="#5030a0"/>
  <rect x="42" y="22" width="6" height="10" fill="#4020a0"/>
  <!-- Mane highlights -->
  <rect x="6" y="18" width="2" height="16" fill="#7050b8"/>
  <rect x="40" y="18" width="2" height="16" fill="#7050b8"/>
  <!-- Side fins - larger than mermander -->
  <rect x="8" y="28" width="8" height="10" fill="#9a70d8"/>
  <rect x="32" y="28" width="8" height="10" fill="#9a70d8"/>
  <rect x="6" y="30" width="6" height="6" fill="#8a60c8"/>
  <rect x="36" y="30" width="6" height="6" fill="#8a60c8"/>
  <!-- Arms/fins -->
  <rect x="8" y="24" width="8" height="8" fill="#a878d8"/>
  <rect x="32" y="24" width="8" height="8" fill="#a878d8"/>
  <!-- Hands -->
  <rect x="6" y="26" width="6" height="8" fill="#9868c8"/>
  <rect x="36" y="26" width="6" height="8" fill="#9868c8"/>
  <!-- Neck -->
  <rect x="19" y="20" width="10" height="6" fill="#b888e8"/>
  <!-- Head - larger, more elegant -->
  <rect x="11" y="4" width="26" height="20" fill="#c89af0"/>
  <!-- Head shading -->
  <rect x="11" y="4" width="2" height="20" fill="#a878d8"/>
  <rect x="35" y="4" width="2" height="20" fill="#a878d8"/>
  <!-- Head highlight -->
  <rect x="13" y="4" width="12" height="5" fill="#d8aaff" opacity="0.6"/>
  <!-- Dark purple flowing mane on head -->
  <rect x="9" y="4" width="6" height="14" fill="#5030a0"/>
  <rect x="33" y="4" width="6" height="14" fill="#5030a0"/>
  <rect x="7" y="6" width="4" height="10" fill="#4020a0"/>
  <rect x="37" y="6" width="4" height="10" fill="#4020a0"/>
  <!-- Mane top flowing back -->
  <rect x="11" y="2" width="26" height="4" fill="#6040a8"/>
  <rect x="13" y="0" width="22" height="4" fill="#7050b8"/>
  <!-- Crown-like fin crest -->
  <rect x="19" y="0" width="10" height="4" fill="#9a70d8"/>
  <rect x="21" y="-2" width="6" height="4" fill="#c89af0"/>
  <!-- Eyes - larger, more elegant -->
  <!-- Left eye -->
  <rect x="13" y="9" width="8" height="8" fill="#ffffff"/>
  <rect x="14" y="10" width="6" height="6" fill="#4a1a8a"/>
  <rect x="15" y="11" width="4" height="4" fill="#6030a0"/>
  <rect x="16" y="12" width="2" height="2" fill="#3a1070"/>
  <rect x="14" y="10" width="2" height="2" fill="#ffffff"/>
  <rect x="19" y="15" width="1" height="1" fill="#ffffff"/>
  <!-- Right eye -->
  <rect x="27" y="9" width="8" height="8" fill="#ffffff"/>
  <rect x="28" y="10" width="6" height="6" fill="#4a1a8a"/>
  <rect x="29" y="11" width="4" height="4" fill="#6030a0"/>
  <rect x="30" y="12" width="2" height="2" fill="#3a1070"/>
  <rect x="28" y="10" width="2" height="2" fill="#ffffff"/>
  <rect x="33" y="15" width="1" height="1" fill="#ffffff"/>
  <!-- Elegant eyelash hints -->
  <rect x="13" y="8" width="2" height="1" fill="#6040a8"/>
  <rect x="17" y="8" width="2" height="1" fill="#6040a8"/>
  <rect x="27" y="8" width="2" height="1" fill="#6040a8"/>
  <rect x="31" y="8" width="2" height="1" fill="#6040a8"/>
  <!-- Nose -->
  <rect x="22" y="18" width="4" height="2" fill="#a878d8"/>
  <!-- Graceful smile -->
  <rect x="19" y="21" width="10" height="2" fill="#8a60b8"/>
  <rect x="18" y="22" width="2" height="2" fill="#8a60b8"/>
  <rect x="28" y="22" width="2" height="2" fill="#8a60b8"/>
  <rect x="20" y="23" width="8" height="1" fill="#9a70c8"/>
  <!-- Light cheeks -->
  <rect x="12" y="17" width="4" height="3" fill="#d0a0f0" opacity="0.6"/>
  <rect x="32" y="17" width="4" height="3" fill="#d0a0f0" opacity="0.6"/>
  <!-- Small horn/gem on forehead -->
  <rect x="22" y="4" width="4" height="4" fill="#f0c0ff"/>
  <rect x="23" y="3" width="2" height="3" fill="#e0a0f8"/>
</svg>
