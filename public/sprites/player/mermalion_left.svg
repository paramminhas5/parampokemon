<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="48" height="64" fill="none"/>
  <!-- MERMALION left side view -->
  <!-- Tail fin sweeping left/down -->
  <rect x="0" y="48" width="18" height="10" fill="#8a60c8"/>
  <rect x="0" y="52" width="12" height="10" fill="#7050b8"/>
  <rect x="0" y="56" width="8" height="6" fill="#5a3aa0"/>
  <rect x="0" y="60" width="4" height="2" fill="#4a2a90"/>
  <!-- Fin highlights -->
  <rect x="2" y="49" width="8" height="3" fill="#b890e8" opacity="0.6"/>
  <!-- Tail body side -->
  <rect x="8" y="44" width="24" height="10" fill="#9a70d8"/>
  <rect x="12" y="38" width="20" height="8" fill="#9a70d8"/>
  <rect x="14" y="32" width="18" height="8" fill="#9a70d8"/>
  <rect x="16" y="26" width="16" height="8" fill="#9a70d8"/>
  <!-- Dorsal fin side -->
  <rect x="26" y="22" width="8" height="18" fill="#7050b8"/>
  <rect x="27" y="16" width="7" height="10" fill="#8060c0"/>
  <rect x="28" y="12" width="6" height="6" fill="#9070c8"/>
  <rect x="29" y="8" width="5" height="6" fill="#b890e8"/>
  <!-- Belly from side -->
  <rect x="12" y="28" width="10" height="16" fill="#e8d8ff"/>
  <!-- Body side -->
  <rect x="14" y="20" width="24" height="14" fill="#c89af0"/>
  <rect x="12" y="22" width="6" height="12" fill="#e8d8ff"/>
  <!-- Body shading -->
  <rect x="14" y="20" width="2" height="14" fill="#a878d8"/>
  <rect x="36" y="20" width="2" height="14" fill="#a878d8"/>
  <!-- Flowing mane from side -->
  <rect x="6" y="10" width="10" height="14" fill="#5030a0"/>
  <rect x="4" y="12" width="8" height="12" fill="#4020a0"/>
  <rect x="2" y="14" width="6" height="10" fill="#3a10a0"/>
  <!-- Mane trail behind -->
  <rect x="38" y="18" width="8" height="10" fill="#6040a8"/>
  <rect x="40" y="20" width="6" height="8" fill="#5030a0"/>
  <!-- Left arm fin extending -->
  <rect x="6" y="22" width="10" height="6" fill="#a878d8"/>
  <rect x="2" y="24" width="6" height="5" fill="#9068c0"/>
  <!-- Neck -->
  <rect x="18" y="16" width="10" height="6" fill="#b888e8"/>
  <!-- Head side - facing left -->
  <rect x="10" y="2" width="26" height="18" fill="#c89af0"/>
  <!-- Head shading -->
  <rect x="10" y="2" width="2" height="18" fill="#a878d8"/>
  <!-- Mane on head left side -->
  <rect x="8" y="2" width="8" height="14" fill="#5030a0"/>
  <rect x="6" y="4" width="6" height="12" fill="#4020a0"/>
  <!-- Face visible (right side facing left) -->
  <rect x="28" y="4" width="8" height="14" fill="#c89af0"/>
  <!-- White belly/chin -->
  <rect x="22" y="12" width="12" height="8" fill="#e8d8ff"/>
  <!-- Crest fin top side -->
  <rect x="22" y="0" width="6" height="4" fill="#9a70d8"/>
  <rect x="23" y="-2" width="4" height="4" fill="#b890e8"/>
  <!-- Eye (facing left, so right eye visible) -->
  <rect x="30" y="5" width="7" height="7" fill="#ffffff"/>
  <rect x="31" y="6" width="5" height="5" fill="#4a1a8a"/>
  <rect x="32" y="7" width="3" height="3" fill="#6030a0"/>
  <rect x="33" y="8" width="1" height="1" fill="#3a1070"/>
  <rect x="31" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="35" y="10" width="1" height="1" fill="#ffffff"/>
  <!-- Eyelash hint -->
  <rect x="30" y="4" width="2" height="1" fill="#5030a0"/>
  <rect x="34" y="4" width="2" height="1" fill="#5030a0"/>
  <!-- Nose side -->
  <rect x="35" y="13" width="3" height="2" fill="#a878d8"/>
  <!-- Mouth side -->
  <rect x="33" y="16" width="5" height="2" fill="#8a60b8"/>
  <!-- Forehead gem side -->
  <rect x="26" y="4" width="3" height="3" fill="#f0c0ff"/>
</svg>
