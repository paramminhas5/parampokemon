<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="48" height="64" fill="none"/>
  <!-- MERMANDER back view -->
  <!-- Tail fin spread - back view, wider from behind -->
  <rect x="6" y="54" width="12" height="6" fill="#4ac8e8"/>
  <rect x="30" y="54" width="12" height="6" fill="#4ac8e8"/>
  <rect x="4" y="56" width="8" height="4" fill="#3ab8d8"/>
  <rect x="36" y="56" width="8" height="4" fill="#3ab8d8"/>
  <!-- Tail fin tips -->
  <rect x="2" y="58" width="6" height="2" fill="#2aa8c8"/>
  <rect x="40" y="58" width="6" height="2" fill="#2aa8c8"/>
  <!-- Center tail notch -->
  <rect x="20" y="58" width="8" height="4" fill="#3ab8d8"/>
  <!-- Tail fin highlights from behind -->
  <rect x="8" y="55" width="4" height="2" fill="#7ce0ff" opacity="0.5"/>
  <rect x="32" y="55" width="4" height="2" fill="#7ce0ff" opacity="0.5"/>
  <!-- Tail body -->
  <rect x="12" y="48" width="24" height="10" fill="#5ad0f0"/>
  <rect x="14" y="44" width="20" height="8" fill="#5ad0f0"/>
  <!-- Dorsal fin - prominent from back -->
  <rect x="20" y="40" width="8" height="12" fill="#4ac0e0"/>
  <rect x="21" y="36" width="6" height="8" fill="#5ad0f0"/>
  <rect x="22" y="32" width="4" height="8" fill="#6ad8f0"/>
  <rect x="23" y="28" width="2" height="6" fill="#7ce0ff"/>
  <!-- Dorsal fin edge highlight -->
  <rect x="20" y="40" width="2" height="12" fill="#7ce0ff" opacity="0.7"/>
  <!-- Scales on tail back -->
  <rect x="14" y="48" width="4" height="2" fill="#4ac0e0"/>
  <rect x="20" y="50" width="4" height="2" fill="#4ac0e0"/>
  <rect x="26" y="48" width="4" height="2" fill="#4ac0e0"/>
  <!-- Body back -->
  <rect x="14" y="26" width="20" height="20" fill="#6ad4f0"/>
  <!-- Body shading from back -->
  <rect x="14" y="26" width="3" height="20" fill="#5ac8e8"/>
  <rect x="31" y="26" width="3" height="20" fill="#5ac8e8"/>
  <!-- Center back line -->
  <rect x="23" y="26" width="2" height="20" fill="#4ab8d8" opacity="0.5"/>
  <!-- Side fins from back -->
  <rect x="8" y="30" width="8" height="10" fill="#5ad0f0"/>
  <rect x="32" y="30" width="8" height="10" fill="#5ad0f0"/>
  <rect x="6" y="32" width="4" height="6" fill="#4ac0e0"/>
  <rect x="38" y="32" width="4" height="6" fill="#4ac0e0"/>
  <!-- Neck back -->
  <rect x="20" y="22" width="8" height="6" fill="#6ad4f0"/>
  <!-- Head back view - rounded -->
  <rect x="12" y="6" width="24" height="20" fill="#6ad4f0"/>
  <!-- Head shading from back -->
  <rect x="12" y="6" width="2" height="20" fill="#5ac8e8"/>
  <rect x="34" y="6" width="2" height="20" fill="#5ac8e8"/>
  <!-- Top of head -->
  <rect x="14" y="4" width="20" height="4" fill="#5ac8e8"/>
  <!-- Crest fin from back -->
  <rect x="22" y="0" width="4" height="8" fill="#4ac0e0"/>
  <rect x="21" y="2" width="6" height="6" fill="#5ad0f0"/>
  <rect x="20" y="4" width="8" height="4" fill="#4ac0e0"/>
  <!-- Back of head detail - no eyes visible -->
  <!-- Small ear fins -->
  <rect x="11" y="12" width="4" height="5" fill="#5ad0f0"/>
  <rect x="33" y="12" width="4" height="5" fill="#5ad0f0"/>
  <!-- Back highlight stripe -->
  <rect x="14" y="8" width="8" height="4" fill="#a0eeff" opacity="0.4"/>
</svg>
