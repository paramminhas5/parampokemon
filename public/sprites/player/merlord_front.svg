<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="48" height="64" fill="none"/>
  <!-- MERLORD - ultimate golden form, front view, most impressive -->
  <!-- MAGNIFICENT TAIL FIN - wide, powerful, golden -->
  <!-- Outer fin rays -->
  <rect x="0" y="50" width="16" height="12" fill="#d4a000"/>
  <rect x="32" y="50" width="16" height="12" fill="#d4a000"/>
  <rect x="0" y="53" width="10" height="9" fill="#c08000"/>
  <rect x="38" y="53" width="10" height="9" fill="#c08000"/>
  <!-- Fin tips -->
  <rect x="0" y="58" width="6" height="4" fill="#a06000"/>
  <rect x="42" y="58" width="6" height="4" fill="#a06000"/>
  <!-- Fin highlights - gold shimmer -->
  <rect x="2" y="50" width="8" height="4" fill="#ffd840"/>
  <rect x="34" y="50" width="8" height="4" fill="#ffd840"/>
  <rect x="1" y="54" width="4" height="4" fill="#f5d24a"/>
  <rect x="39" y="54" width="4" height="4" fill="#f5d24a"/>
  <!-- Lower fin glow -->
  <rect x="6" y="58" width="36" height="4" fill="#f5d24a" opacity="0.4"/>
  <!-- Inner tail fin lighter gold -->
  <rect x="8" y="52" width="14" height="8" fill="#f5d24a"/>
  <rect x="26" y="52" width="14" height="8" fill="#f5d24a"/>
  <!-- Tail body - thick and powerful -->
  <rect x="10" y="44" width="28" height="12" fill="#d4a800"/>
  <rect x="12" y="38" width="24" height="10" fill="#d4a800"/>
  <!-- Tail scales - ornate -->
  <rect x="12" y="44" width="5" height="4" fill="#c89000"/>
  <rect x="19" y="46" width="5" height="4" fill="#c89000"/>
  <rect x="26" y="44" width="5" height="4" fill="#c89000"/>
  <rect x="33" y="46" width="5" height="4" fill="#c89000"/>
  <!-- Scale highlights -->
  <rect x="12" y="44" width="3" height="1" fill="#ffd840"/>
  <rect x="19" y="46" width="3" height="1" fill="#ffd840"/>
  <rect x="26" y="44" width="3" height="1" fill="#ffd840"/>
  <rect x="33" y="46" width="3" height="1" fill="#ffd840"/>
  <!-- Tail mid -->
  <rect x="14" y="32" width="20" height="10" fill="#d4a800"/>
  <!-- Tail highlight stripe -->
  <rect x="22" y="32" width="4" height="10" fill="#ffd840" opacity="0.5"/>
  <!-- White/cream belly -->
  <rect x="17" y="24" width="14" height="14" fill="#fff8e0"/>
  <rect x="15" y="28" width="18" height="8" fill="#fff8e0"/>
  <!-- CRIMSON ROYAL CAPE - flows behind -->
  <rect x="4" y="14" width="40" height="36" fill="#c03030" opacity="0.6"/>
  <rect x="6" y="16" width="36" height="34" fill="#a02020"/>
  <!-- Cape shading -->
  <rect x="6" y="16" width="4" height="34" fill="#c83030"/>
  <rect x="38" y="16" width="4" height="34" fill="#8a1010"/>
  <!-- Cape fold highlights -->
  <rect x="12" y="18" width="2" height="28" fill="#d04040" opacity="0.6"/>
  <rect x="26" y="20" width="2" height="26" fill="#c83030" opacity="0.4"/>
  <rect x="36" y="18" width="2" height="24" fill="#d04040" opacity="0.3"/>
  <!-- Body - gold, powerful and large -->
  <rect x="11" y="18" width="26" height="20" fill="#d4a800"/>
  <!-- Body shading -->
  <rect x="11" y="18" width="2" height="20" fill="#b88800"/>
  <rect x="35" y="18" width="2" height="20" fill="#b88800"/>
  <!-- Chest plate detail -->
  <rect x="13" y="20" width="22" height="12" fill="#c89800"/>
  <rect x="13" y="20" width="22" height="2" fill="#ffd840"/>
  <!-- Chest emblem -->
  <rect x="21" y="22" width="6" height="8" fill="#d4a800"/>
  <rect x="22" y="24" width="4" height="4" fill="#c03030"/>
  <!-- Body highlights -->
  <rect x="13" y="22" width="6" height="10" fill="#ffd840" opacity="0.4"/>
  <!-- Large shoulder fins - impressive -->
  <rect x="4" y="16" width="10" height="12" fill="#c89000"/>
  <rect x="34" y="16" width="10" height="12" fill="#c89000"/>
  <rect x="2" y="18" width="8" height="10" fill="#b87800"/>
  <rect x="38" y="18" width="8" height="10" fill="#b87800"/>
  <!-- Shoulder fin spikes -->
  <rect x="2" y="16" width="4" height="4" fill="#ffd840"/>
  <rect x="42" y="16" width="4" height="4" fill="#ffd840"/>
  <!-- Arms - powerful -->
  <rect x="6" y="20" width="10" height="10" fill="#d4a800"/>
  <rect x="32" y="20" width="10" height="10" fill="#d4a800"/>
  <!-- Gauntlet-like fins on arms -->
  <rect x="4" y="24" width="8" height="8" fill="#c89000"/>
  <rect x="36" y="24" width="8" height="8" fill="#c89000"/>
  <!-- Hands -->
  <rect x="2" y="28" width="8" height="6" fill="#c89800"/>
  <rect x="38" y="28" width="8" height="6" fill="#c89800"/>
  <!-- Hand highlights -->
  <rect x="2" y="28" width="4" height="2" fill="#ffd840"/>
  <rect x="38" y="28" width="4" height="2" fill="#ffd840"/>
  <!-- Neck armor -->
  <rect x="18" y="14" width="12" height="6" fill="#c89000"/>
  <rect x="18" y="14" width="12" height="2" fill="#ffd840"/>
  <!-- HEAD - large, imposing, regal -->
  <rect x="10" y="2" width="28" height="16" fill="#d4a800"/>
  <!-- Head shading -->
  <rect x="10" y="2" width="2" height="16" fill="#b88800"/>
  <rect x="36" y="2" width="2" height="16" fill="#b88800"/>
  <!-- Head highlights -->
  <rect x="12" y="2" width="12" height="4" fill="#ffd840" opacity="0.5"/>
  <!-- 3-SPIKE GOLD CROWN - magnificent -->
  <!-- Crown base -->
  <rect x="10" y="0" width="28" height="4" fill="#f5d24a"/>
  <!-- Crown base highlights -->
  <rect x="10" y="0" width="28" height="1" fill="#fff070"/>
  <!-- Left spike -->
  <rect x="10" y="-4" width="6" height="6" fill="#f5d24a"/>
  <rect x="11" y="-6" width="4" height="4" fill="#ffd840"/>
  <rect x="12" y="-7" width="2" height="3" fill="#fff070"/>
  <!-- Center spike - tallest, most magnificent -->
  <rect x="20" y="-6" width="8" height="8" fill="#f5d24a"/>
  <rect x="21" y="-8" width="6" height="6" fill="#ffd840"/>
  <rect x="22" y="-10" width="4" height="6" fill="#fff070"/>
  <rect x="23" y="-11" width="2" height="3" fill="#ffffff" opacity="0.8"/>
  <!-- Right spike -->
  <rect x="32" y="-4" width="6" height="6" fill="#f5d24a"/>
  <rect x="33" y="-6" width="4" height="4" fill="#ffd840"/>
  <rect x="34" y="-7" width="2" height="3" fill="#fff070"/>
  <!-- Crown gems - crimson -->
  <rect x="13" y="0" width="2" height="3" fill="#c03030"/>
  <rect x="22" y="-1" width="4" height="3" fill="#c03030"/>
  <rect x="33" y="0" width="2" height="3" fill="#c03030"/>
  <!-- Crown gold band highlight -->
  <rect x="10" y="2" width="28" height="1" fill="#fff070"/>
  <!-- Eyes - powerful, intense, golden-irised -->
  <!-- Left eye -->
  <rect x="13" y="5" width="9" height="8" fill="#ffffff"/>
  <rect x="14" y="6" width="7" height="6" fill="#8a6000"/>
  <rect x="15" y="7" width="5" height="4" fill="#c8a000"/>
  <rect x="16" y="8" width="3" height="2" fill="#ffd840"/>
  <rect x="14" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="20" y="11" width="1" height="1" fill="#ffffff"/>
  <!-- Eye outline black -->
  <rect x="13" y="5" width="9" height="1" fill="#1a0a00"/>
  <rect x="13" y="12" width="9" height="1" fill="#1a0a00"/>
  <rect x="13" y="5" width="1" height="8" fill="#1a0a00"/>
  <rect x="21" y="5" width="1" height="8" fill="#1a0a00"/>
  <!-- Right eye -->
  <rect x="26" y="5" width="9" height="8" fill="#ffffff"/>
  <rect x="27" y="6" width="7" height="6" fill="#8a6000"/>
  <rect x="28" y="7" width="5" height="4" fill="#c8a000"/>
  <rect x="29" y="8" width="3" height="2" fill="#ffd840"/>
  <rect x="27" y="6" width="2" height="2" fill="#ffffff"/>
  <rect x="33" y="11" width="1" height="1" fill="#ffffff"/>
  <rect x="26" y="5" width="9" height="1" fill="#1a0a00"/>
  <rect x="26" y="12" width="9" height="1" fill="#1a0a00"/>
  <rect x="26" y="5" width="1" height="8" fill="#1a0a00"/>
  <rect x="34" y="5" width="1" height="8" fill="#1a0a00"/>
  <!-- Commanding brows - thick, powerful -->
  <rect x="12" y="3" width="10" height="3" fill="#8a5800"/>
  <rect x="26" y="3" width="10" height="3" fill="#8a5800"/>
  <rect x="12" y="4" width="2" height="2" fill="#c87800"/>
  <rect x="34" y="4" width="2" height="2" fill="#c87800"/>
  <!-- Nose - noble -->
  <rect x="21" y="13" width="6" height="2" fill="#b88800"/>
  <!-- Determined powerful mouth -->
  <rect x="17" y="16" width="14" height="2" fill="#a07800"/>
  <rect x="16" y="17" width="2" height="2" fill="#a07800"/>
  <rect x="30" y="17" width="2" height="2" fill="#a07800"/>
  <rect x="18" y="18" width="12" height="1" fill="#c89800"/>
  <!-- Chin scales -->
  <rect x="18" y="17" width="4" height="1" fill="#c89000"/>
  <rect x="26" y="17" width="4" height="1" fill="#c89000"/>
  <!-- Aura glow lines -->
  <rect x="0" y="30" width="4" height="2" fill="#ffd840" opacity="0.3"/>
  <rect x="44" y="28" width="4" height="2" fill="#ffd840" opacity="0.3"/>
  <rect x="1" y="24" width="3" height="2" fill="#ffd840" opacity="0.2"/>
  <rect x="44" y="22" width="3" height="2" fill="#ffd840" opacity="0.2"/>
</svg>
