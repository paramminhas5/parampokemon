<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="48" height="64" fill="none"/>
  <!-- MERMANDER left side view -->
  <!-- Tail fin - side profile, sweeping left -->
  <rect x="2" y="50" width="14" height="8" fill="#4ac8e8"/>
  <rect x="0" y="52" width="10" height="8" fill="#3ab8d8"/>
  <!-- Tail fin tip -->
  <rect x="0" y="56" width="6" height="4" fill="#2aa8c8"/>
  <rect x="0" y="58" width="4" height="2" fill="#1a98b8"/>
  <!-- Tail fin highlight -->
  <rect x="2" y="51" width="6" height="3" fill="#7ce0ff" opacity="0.5"/>
  <!-- Tail body side view -->
  <rect x="10" y="46" width="22" height="10" fill="#5ad0f0"/>
  <rect x="14" y="42" width="18" height="8" fill="#5ad0f0"/>
  <!-- Tail narrows -->
  <rect x="16" y="38" width="14" height="6" fill="#5ad0f0"/>
  <rect x="18" y="34" width="12" height="6" fill="#5ad0f0"/>
  <!-- Tail-to-body transition -->
  <rect x="16" y="30" width="14" height="6" fill="#5ad0f0"/>
  <!-- Dorsal fin side view -->
  <rect x="24" y="28" width="6" height="14" fill="#4ac0e0"/>
  <rect x="25" y="24" width="5" height="8" fill="#5ad0f0"/>
  <rect x="26" y="20" width="4" height="6" fill="#6ad8f0"/>
  <rect x="27" y="18" width="3" height="4" fill="#7ce0ff"/>
  <!-- White belly (right side visible from left) -->
  <rect x="14" y="30" width="8" height="12" fill="#e8f8ff"/>
  <!-- Body -->
  <rect x="16" y="22" width="20" height="14" fill="#7ce0ff"/>
  <rect x="14" y="24" width="4" height="12" fill="#e8f8ff"/>
  <!-- Body left shading -->
  <rect x="16" y="22" width="2" height="14" fill="#5ac8e8"/>
  <!-- Body highlight -->
  <rect x="30" y="24" width="4" height="8" fill="#a0eeff" opacity="0.5"/>
  <!-- Left arm/fin (pointing forward, toward viewer-left) -->
  <rect x="10" y="26" width="8" height="5" fill="#5ad0f0"/>
  <rect x="6" y="28" width="6" height="4" fill="#4ac0e0"/>
  <!-- Neck side -->
  <rect x="20" y="18" width="8" height="6" fill="#7ce0ff"/>
  <!-- Head side view - facing left -->
  <rect x="12" y="4" width="22" height="18" fill="#7ce0ff"/>
  <!-- Head left side shading -->
  <rect x="12" y="4" width="2" height="18" fill="#5ac8e8"/>
  <!-- Face (right side of head when facing left) -->
  <rect x="26" y="6" width="8" height="14" fill="#7ce0ff"/>
  <!-- White chin/belly from side -->
  <rect x="20" y="14" width="12" height="8" fill="#e8f8ff"/>
  <!-- Crest fin side view -->
  <rect x="20" y="2" width="4" height="6" fill="#4ac0e0"/>
  <rect x="21" y="0" width="3" height="4" fill="#5ad0f0"/>
  <rect x="22" y="0" width="2" height="2" fill="#7ce0ff"/>
  <!-- Left eye (visible when facing left) -->
  <rect x="28" y="8" width="7" height="7" fill="#ffffff"/>
  <rect x="29" y="9" width="5" height="5" fill="#1a3a6a"/>
  <rect x="30" y="10" width="3" height="3" fill="#2a4a8a"/>
  <rect x="31" y="11" width="1" height="1" fill="#0a1a3a"/>
  <rect x="29" y="9" width="2" height="2" fill="#ffffff"/>
  <rect x="33" y="13" width="1" height="1" fill="#ffffff"/>
  <!-- Nose side -->
  <rect x="32" y="16" width="3" height="2" fill="#5ac8e8"/>
  <!-- Mouth side -->
  <rect x="30" y="19" width="5" height="2" fill="#4ab8d8"/>
  <rect x="32" y="18" width="3" height="2" fill="#4ab8d8"/>
  <!-- Cheek from side -->
  <rect x="28" y="16" width="3" height="3" fill="#90d8f0" opacity="0.5"/>
</svg>
