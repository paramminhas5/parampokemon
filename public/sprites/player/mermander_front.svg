<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Transparent background -->
  <rect width="48" height="64" fill="none"/>
  <!-- MERMANDER - cute aqua mer-creature, front view -->
  <!-- Fish tail - bottom half -->
  <!-- Tail fin spread -->
  <rect x="8" y="54" width="10" height="6" fill="#4ac8e8"/>
  <rect x="30" y="54" width="10" height="6" fill="#4ac8e8"/>
  <rect x="6" y="56" width="6" height="4" fill="#3ab8d8"/>
  <rect x="36" y="56" width="6" height="4" fill="#3ab8d8"/>
  <!-- Tail fin tips -->
  <rect x="4" y="58" width="4" height="2" fill="#2aa8c8"/>
  <rect x="40" y="58" width="4" height="2" fill="#2aa8c8"/>
  <!-- Tail fin highlights -->
  <rect x="9" y="55" width="4" height="2" fill="#7ce0ff"/>
  <rect x="31" y="55" width="4" height="2" fill="#7ce0ff"/>
  <!-- Tail body connecting -->
  <rect x="14" y="48" width="20" height="10" fill="#5ad0f0"/>
  <rect x="12" y="50" width="24" height="8" fill="#5ad0f0"/>
  <!-- Tail scales pattern -->
  <rect x="14" y="48" width="4" height="2" fill="#4ac0e0"/>
  <rect x="20" y="50" width="4" height="2" fill="#4ac0e0"/>
  <rect x="26" y="48" width="4" height="2" fill="#4ac0e0"/>
  <rect x="16" y="52" width="4" height="2" fill="#4ac0e0"/>
  <rect x="24" y="52" width="4" height="2" fill="#4ac0e0"/>
  <!-- Tail mid section -->
  <rect x="16" y="42" width="16" height="8" fill="#5ad0f0"/>
  <!-- Tail highlight stripe -->
  <rect x="22" y="42" width="4" height="8" fill="#7ce0ff" opacity="0.6"/>
  <!-- White belly area -->
  <rect x="18" y="30" width="12" height="14" fill="#e8f8ff"/>
  <rect x="16" y="34" width="16" height="8" fill="#e8f8ff"/>
  <!-- Body - aqua blue -->
  <rect x="14" y="26" width="20" height="20" fill="#7ce0ff"/>
  <!-- Body shading -->
  <rect x="14" y="26" width="2" height="20" fill="#5ac8e8"/>
  <rect x="32" y="26" width="2" height="20" fill="#5ac8e8"/>
  <!-- Body highlights -->
  <rect x="16" y="28" width="4" height="8" fill="#a0eeff" opacity="0.6"/>
  <!-- Small cute fins on sides -->
  <rect x="10" y="32" width="6" height="8" fill="#5ad0f0"/>
  <rect x="10" y="32" width="2" height="8" fill="#7ce0ff"/>
  <rect x="32" y="32" width="6" height="8" fill="#5ad0f0"/>
  <rect x="36" y="32" width="2" height="8" fill="#3ab8d8"/>
  <!-- Fin tips -->
  <rect x="8" y="34" width="4" height="4" fill="#4ac0e0"/>
  <rect x="36" y="34" width="4" height="4" fill="#4ac0e0"/>
  <!-- Short arms/fins -->
  <rect x="10" y="28" width="6" height="6" fill="#5ad0f0"/>
  <rect x="32" y="28" width="6" height="6" fill="#5ad0f0"/>
  <!-- Hand fins -->
  <rect x="8" y="30" width="4" height="6" fill="#4ac0e0"/>
  <rect x="36" y="30" width="4" height="6" fill="#4ac0e0"/>
  <!-- Neck -->
  <rect x="20" y="22" width="8" height="6" fill="#7ce0ff"/>
  <!-- Head - big chibi head -->
  <rect x="12" y="6" width="24" height="20" fill="#7ce0ff"/>
  <!-- Head shading -->
  <rect x="12" y="6" width="2" height="20" fill="#5ac8e8"/>
  <rect x="34" y="6" width="2" height="20" fill="#5ac8e8"/>
  <!-- Head top highlight -->
  <rect x="14" y="6" width="10" height="4" fill="#a0eeff" opacity="0.7"/>
  <!-- White belly extends to chin -->
  <rect x="18" y="16" width="12" height="10" fill="#e8f8ff"/>
  <!-- Crest fin on head - small cute ridge -->
  <rect x="22" y="2" width="4" height="6" fill="#4ac0e0"/>
  <rect x="20" y="4" width="8" height="4" fill="#5ad0f0"/>
  <rect x="21" y="2" width="6" height="3" fill="#7ce0ff"/>
  <rect x="22" y="1" width="4" height="3" fill="#4ac0e0"/>
  <rect x="23" y="0" width="2" height="3" fill="#7ce0ff"/>
  <!-- Big adorable EYES -->
  <!-- Left eye -->
  <rect x="14" y="10" width="8" height="8" fill="#ffffff"/>
  <rect x="15" y="11" width="6" height="6" fill="#1a3a6a"/>
  <rect x="16" y="12" width="4" height="4" fill="#2a4a8a"/>
  <rect x="17" y="13" width="2" height="2" fill="#0a1a3a"/>
  <rect x="15" y="11" width="2" height="2" fill="#ffffff"/>
  <!-- Left eye sparkle -->
  <rect x="15" y="11" width="2" height="2" fill="#ffffff"/>
  <rect x="19" y="15" width="1" height="1" fill="#ffffff"/>
  <!-- Right eye -->
  <rect x="26" y="10" width="8" height="8" fill="#ffffff"/>
  <rect x="27" y="11" width="6" height="6" fill="#1a3a6a"/>
  <rect x="28" y="12" width="4" height="4" fill="#2a4a8a"/>
  <rect x="29" y="13" width="2" height="2" fill="#0a1a3a"/>
  <rect x="27" y="11" width="2" height="2" fill="#ffffff"/>
  <rect x="31" y="15" width="1" height="1" fill="#ffffff"/>
  <!-- Small cute nose -->
  <rect x="22" y="18" width="4" height="2" fill="#5ac8e8"/>
  <rect x="23" y="17" width="2" height="2" fill="#4ab8d8"/>
  <!-- Happy smile mouth -->
  <rect x="19" y="20" width="10" height="2" fill="#4ab8d8"/>
  <rect x="18" y="21" width="2" height="2" fill="#4ab8d8"/>
  <rect x="28" y="21" width="2" height="2" fill="#4ab8d8"/>
  <rect x="20" y="22" width="8" height="2" fill="#5ac8e8"/>
  <!-- Rosy cheeks -->
  <rect x="13" y="17" width="4" height="3" fill="#90d8f0" opacity="0.6"/>
  <rect x="31" y="17" width="4" height="3" fill="#90d8f0" opacity="0.6"/>
</svg>
