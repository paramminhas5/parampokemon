<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Sky -->
  <rect width="64" height="64" fill="#87ceeb"/>
  <!-- Clouds -->
  <rect x="4" y="6" width="14" height="5" rx="2" fill="white" opacity="0.9"/>
  <rect x="6" y="4" width="10" height="5" rx="2" fill="white" opacity="0.9"/>
  <rect x="42" y="8" width="12" height="4" rx="2" fill="white" opacity="0.85"/>
  <!-- Ground -->
  <rect x="0" y="46" width="64" height="18" fill="#4a9a44"/>
  <rect x="0" y="46" width="64" height="2" fill="#5fb255"/>
  <!-- Path -->
  <rect x="26" y="46" width="12" height="18" fill="#d8b888"/>
  <!-- House body -->
  <rect x="12" y="28" width="40" height="20" fill="#e8dcc8"/>
  <!-- Roof -->
  <polygon points="10,28 32,12 54,28" fill="#b03828"/>
  <polygon points="10,28 32,14 54,28" fill="#c04030"/>
  <!-- Chimney -->
  <rect x="38" y="14" width="6" height="10" fill="#8a3820"/>
  <rect x="37" y="13" width="8" height="3" fill="#7a3018"/>
  <!-- Smoke puffs -->
  <circle cx="41" cy="11" r="2" fill="#d0d0d0" opacity="0.7"/>
  <circle cx="43" cy="9" r="1.5" fill="#e0e0e0" opacity="0.5"/>
  <!-- Door -->
  <rect x="27" y="36" width="10" height="12" fill="#7a3818"/>
  <rect x="28" y="37" width="8" height="10" fill="#6a3010"/>
  <circle cx="36" cy="43" r="1" fill="#f5d24a"/>
  <!-- Windows -->
  <rect x="14" y="32" width="9" height="8" fill="#a8d0e8"/>
  <rect x="14" y="32" width="9" height="1" fill="#6090a8"/>
  <rect x="18" y="32" width="1" height="8" fill="#6090a8"/>
  <rect x="41" y="32" width="9" height="8" fill="#a8d0e8"/>
  <rect x="41" y="32" width="9" height="1" fill="#6090a8"/>
  <rect x="45" y="32" width="1" height="8" fill="#6090a8"/>
  <!-- Window glow -->
  <rect x="15" y="33" width="3" height="3" fill="#fffcaa" opacity="0.6"/>
  <rect x="42" y="33" width="3" height="3" fill="#fffcaa" opacity="0.6"/>
  <!-- Fence -->
  <rect x="4" y="43" width="20" height="3" fill="#d8c098"/>
  <rect x="4" y="40" width="2" height="7" fill="#b8a070"/>
  <rect x="10" y="40" width="2" height="7" fill="#b8a070"/>
  <rect x="16" y="40" width="2" height="7" fill="#b8a070"/>
  <rect x="22" y="40" width="2" height="7" fill="#b8a070"/>
  <!-- Flowers -->
  <circle cx="8" cy="46" r="1.5" fill="#e85e5e"/>
  <circle cx="12" cy="47" r="1.5" fill="#f5d24a"/>
  <circle cx="52" cy="46" r="1.5" fill="#e85e5e"/>
  <circle cx="56" cy="47" r="1.5" fill="#f5d24a"/>
  <!-- Tree -->
  <rect x="52" y="34" width="3" height="12" fill="#5a3a1c"/>
  <circle cx="53" cy="30" r="7" fill="#2e6a2a"/>
  <circle cx="49" cy="33" r="5" fill="#3a7a34"/>
  <circle cx="57" cy="33" r="5" fill="#3a7a34"/>
</svg>
