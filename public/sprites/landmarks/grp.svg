<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Sky -->
  <rect width="64" height="64" fill="#c8e8b0"/>
  <rect width="64" height="20" fill="#a0d880"/>
  <!-- Ground -->
  <rect x="0" y="50" width="64" height="14" fill="#5fb255"/>
  <!-- Market building back wall -->
  <rect x="4" y="22" width="56" height="30" fill="#e8f0d8"/>
  <!-- Awnings - 3 stalls -->
  <rect x="4" y="18" width="17" height="8" fill="#4a9a3a"/>
  <rect x="4" y="18" width="17" height="2" fill="#3a7a2a"/>
  <rect x="23" y="16" width="18" height="10" fill="#5aaa4a"/>
  <rect x="23" y="16" width="18" height="2" fill="#3a7a2a"/>
  <rect x="43" y="18" width="17" height="8" fill="#4a9a3a"/>
  <rect x="43" y="18" width="17" height="2" fill="#3a7a2a"/>
  <!-- Awning stripes -->
  <rect x="7" y="18" width="2" height="8" fill="#3a7a2a" opacity="0.4"/>
  <rect x="12" y="18" width="2" height="8" fill="#3a7a2a" opacity="0.4"/>
  <rect x="27" y="16" width="2" height="10" fill="#3a7a2a" opacity="0.4"/>
  <rect x="33" y="16" width="2" height="10" fill="#3a7a2a" opacity="0.4"/>
  <rect x="46" y="18" width="2" height="8" fill="#3a7a2a" opacity="0.4"/>
  <rect x="52" y="18" width="2" height="8" fill="#3a7a2a" opacity="0.4"/>
  <!-- Digital price board -->
  <rect x="14" y="6" width="36" height="12" fill="#1a2a1a"/>
  <rect x="14" y="6" width="36" height="1" fill="#4a8a3a"/>
  <rect x="14" y="17" width="36" height="1" fill="#4a8a3a"/>
  <rect x="15" y="7" width="34" height="9" fill="#0a160a"/>
  <!-- Price display text bars -->
  <rect x="17" y="9" width="8" height="2" fill="#7ac46a"/>
  <rect x="27" y="9" width="5" height="2" fill="#f5d24a"/>
  <rect x="34" y="9" width="12" height="2" fill="#7ac46a"/>
  <rect x="17" y="12" width="12" height="2" fill="#4a8a3a"/>
  <rect x="31" y="12" width="8" height="2" fill="#4a8a3a"/>
  <!-- Counter shelves -->
  <rect x="4" y="38" width="17" height="3" fill="#a87840"/>
  <rect x="23" y="36" width="18" height="3" fill="#a87840"/>
  <rect x="43" y="38" width="17" height="3" fill="#a87840"/>
  <!-- Products on shelves -->
  <rect x="6" y="35" width="4" height="3" fill="#e85e5e"/>
  <rect x="11" y="35" width="4" height="3" fill="#f5d24a"/>
  <rect x="25" y="33" width="4" height="3" fill="#7ac46a"/>
  <rect x="31" y="33" width="4" height="3" fill="#ff9fd4"/>
  <rect x="37" y="33" width="4" height="3" fill="#7ce0ff"/>
  <rect x="45" y="35" width="4" height="3" fill="#e85e5e"/>
  <rect x="51" y="35" width="4" height="3" fill="#f5d24a"/>
  <!-- Price tags hanging -->
  <rect x="8" y="30" width="6" height="4" fill="#f5d24a"/>
  <rect x="9" y="31" width="4" height="1" fill="#3a2010"/>
  <rect x="28" y="28" width="6" height="4" fill="#f5d24a"/>
  <rect x="29" y="29" width="4" height="1" fill="#3a2010"/>
  <rect x="48" y="30" width="6" height="4" fill="#f5d24a"/>
  <rect x="49" y="31" width="4" height="1" fill="#3a2010"/>
  <!-- Ground path -->
  <rect x="26" y="50" width="12" height="14" fill="#d8b888"/>
</svg>
