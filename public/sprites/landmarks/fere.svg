<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Dark crypto night -->
  <rect width="64" height="64" fill="#010e08"/>
  <!-- Data particles -->
  <rect x="4" y="5" width="1" height="1" fill="#00e8a0" opacity="0.7"/>
  <rect x="18" y="3" width="1" height="1" fill="#00e8a0" opacity="0.5"/>
  <rect x="48" y="7" width="1" height="1" fill="#9fffd0" opacity="0.6"/>
  <rect x="60" y="4" width="1" height="1" fill="#00e8a0" opacity="0.4"/>
  <!-- Ground - PCB board -->
  <rect x="0" y="56" width="64" height="8" fill="#021a10"/>
  <rect x="0" y="56" width="64" height="1" fill="#00e8a0" opacity="0.4"/>
  <!-- PCB traces on ground -->
  <rect x="8" y="58" width="12" height="1" fill="#00e8a0" opacity="0.5"/>
  <rect x="44" y="59" width="10" height="1" fill="#00e8a0" opacity="0.5"/>
  <!-- Building body -->
  <rect x="8" y="16" width="48" height="42" fill="#021a10"/>
  <!-- Circuit trace lines on facade -->
  <rect x="8" y="22" width="48" height="1" fill="#00e8a0" opacity="0.6"/>
  <rect x="8" y="30" width="48" height="1" fill="#00e8a0" opacity="0.5"/>
  <rect x="8" y="38" width="48" height="1" fill="#00e8a0" opacity="0.6"/>
  <rect x="8" y="46" width="48" height="1" fill="#00e8a0" opacity="0.4"/>
  <rect x="8" y="54" width="48" height="1" fill="#00e8a0" opacity="0.3"/>
  <!-- Vertical circuit traces -->
  <rect x="18" y="16" width="1" height="42" fill="#00e8a0" opacity="0.3"/>
  <rect x="32" y="16" width="1" height="42" fill="#00e8a0" opacity="0.4"/>
  <rect x="46" y="16" width="1" height="42" fill="#00e8a0" opacity="0.3"/>
  <!-- Via pads at intersections -->
  <rect x="17" y="21" width="3" height="3" fill="#00e8a0" opacity="0.8"/>
  <rect x="31" y="29" width="3" height="3" fill="#9fffd0" opacity="0.8"/>
  <rect x="45" y="37" width="3" height="3" fill="#00e8a0" opacity="0.8"/>
  <rect x="17" y="45" width="3" height="3" fill="#9fffd0" opacity="0.7"/>
  <!-- Roof -->
  <rect x="6" y="10" width="52" height="8" fill="#03280f"/>
  <rect x="6" y="10" width="52" height="2" fill="#00e8a0"/>
  <!-- AI agent symbol above building -->
  <rect x="22" y="4" width="20" height="8" fill="#021a10"/>
  <rect x="22" y="4" width="20" height="1" fill="#00e8a0"/>
  <!-- Agent eye dots -->
  <circle cx="28" cy="8" r="2" fill="#00e8a0"/>
  <circle cx="36" cy="8" r="2" fill="#00e8a0"/>
  <rect x="28" y="11" width="8" height="1" fill="#00e8a0" opacity="0.7"/>
  <!-- Windows - green tinted -->
  <rect x="11" y="18" width="5" height="3" fill="#00e8a0" opacity="0.7"/>
  <rect x="19" y="18" width="5" height="3" fill="#9fffd0" opacity="0.5"/>
  <rect x="35" y="18" width="5" height="3" fill="#00e8a0" opacity="0.8"/>
  <rect x="43" y="18" width="5" height="3" fill="#00e8a0" opacity="0.6"/>
  <rect x="11" y="25" width="5" height="3" fill="#9fffd0" opacity="0.6"/>
  <rect x="35" y="25" width="5" height="3" fill="#00e8a0" opacity="0.9"/>
  <rect x="43" y="25" width="5" height="3" fill="#9fffd0" opacity="0.5"/>
  <rect x="19" y="33" width="5" height="3" fill="#00e8a0" opacity="0.7"/>
  <rect x="43" y="33" width="5" height="3" fill="#00e8a0" opacity="0.8"/>
  <!-- Ticker tape scrolling display -->
  <rect x="8" y="50" width="48" height="5" fill="#010e08"/>
  <rect x="8" y="50" width="48" height="1" fill="#00e8a0" opacity="0.5"/>
  <rect x="10" y="51" width="6" height="2" fill="#00e8a0" opacity="0.8"/>
  <rect x="18" y="51" width="4" height="2" fill="#e83a3a" opacity="0.7"/>
  <rect x="24" y="51" width="6" height="2" fill="#00e8a0" opacity="0.9"/>
  <rect x="32" y="51" width="3" height="2" fill="#9fffd0" opacity="0.6"/>
  <!-- Door -->
  <rect x="24" y="54" width="16" height="4" fill="#010e08"/>
  <rect x="24" y="54" width="16" height="1" fill="#00e8a0" opacity="0.6"/>
  <!-- Green glow -->
  <ellipse cx="32" cy="58" rx="24" ry="2" fill="#00e8a0" opacity="0.08"/>
</svg>
