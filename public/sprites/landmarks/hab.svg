<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Warm sunset sky -->
  <rect width="64" height="64" fill="#e8a060"/>
  <rect width="64" height="18" fill="#c87840"/>
  <!-- Ground -->
  <rect x="0" y="54" width="64" height="10" fill="#a67855"/>
  <!-- Apartment building - 3 floors -->
  <rect x="10" y="18" width="44" height="38" fill="#c47833"/>
  <!-- Brick texture lines -->
  <rect x="10" y="24" width="44" height="1" fill="#a06028" opacity="0.5"/>
  <rect x="10" y="30" width="44" height="1" fill="#a06028" opacity="0.5"/>
  <rect x="10" y="36" width="44" height="1" fill="#a06028" opacity="0.5"/>
  <rect x="10" y="42" width="44" height="1" fill="#a06028" opacity="0.5"/>
  <rect x="10" y="48" width="44" height="1" fill="#a06028" opacity="0.5"/>
  <!-- Roof -->
  <rect x="8" y="14" width="48" height="6" fill="#7a3818"/>
  <rect x="8" y="14" width="48" height="2" fill="#5a2010"/>
  <!-- Chimney -->
  <rect x="20" y="8" width="6" height="8" fill="#6a3010"/>
  <rect x="19" y="7" width="8" height="3" fill="#5a2808"/>
  <!-- Windows - floor 3 -->
  <rect x="14" y="20" width="8" height="6" fill="#f5d24a" opacity="0.9"/>
  <rect x="14" y="20" width="8" height="1" fill="#c0a020"/>
  <rect x="18" y="20" width="1" height="6" fill="#c0a020"/>
  <rect x="26" y="20" width="8" height="6" fill="#f5d24a" opacity="0.8"/>
  <rect x="26" y="20" width="8" height="1" fill="#c0a020"/>
  <rect x="40" y="20" width="8" height="6" fill="#ffe090" opacity="0.7"/>
  <rect x="40" y="20" width="8" height="1" fill="#c0a020"/>
  <!-- Windows - floor 2 -->
  <rect x="14" y="32" width="8" height="6" fill="#ffe090" opacity="0.9"/>
  <rect x="14" y="32" width="8" height="1" fill="#c0a020"/>
  <rect x="18" y="32" width="1" height="6" fill="#c0a020"/>
  <rect x="26" y="32" width="8" height="6" fill="#f5d24a" opacity="0.6"/>
  <rect x="26" y="32" width="8" height="1" fill="#c0a020"/>
  <rect x="40" y="32" width="8" height="6" fill="#f5d24a" opacity="0.9"/>
  <rect x="40" y="32" width="8" height="1" fill="#c0a020"/>
  <!-- Floor 1 + door -->
  <rect x="14" y="44" width="8" height="6" fill="#ffe090" opacity="0.8"/>
  <rect x="27" y="42" width="10" height="14" fill="#7a3818"/>
  <rect x="28" y="43" width="8" height="12" fill="#4a2010"/>
  <circle cx="35" cy="50" r="1" fill="#f5d24a"/>
  <!-- Balconies -->
  <rect x="12" y="27" width="12" height="2" fill="#8a4828"/>
  <rect x="24" y="27" width="1" height="5" fill="#8a4828"/>
  <rect x="38" y="27" width="12" height="2" fill="#8a4828"/>
  <rect x="38" y="27" width="1" height="5" fill="#8a4828"/>
  <!-- Potted plants on balconies -->
  <rect x="15" y="24" width="3" height="3" fill="#2e6a2a"/>
  <rect x="42" y="24" width="3" height="3" fill="#2e6a2a"/>
  <!-- FOR RENT sign -->
  <rect x="16" y="56" width="32" height="7" fill="#f5d24a"/>
  <rect x="16" y="56" width="32" height="1" fill="#c0a020"/>
  <rect x="18" y="58" width="28" height="1" fill="#3a2010"/>
  <rect x="20" y="60" width="20" height="1" fill="#3a2010"/>
</svg>
