<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Deep navy night sky -->
  <rect width="64" height="64" fill="#080e20"/>
  <!-- Stars -->
  <rect x="4" y="3" width="1" height="1" fill="#9fe8ff" opacity="0.8"/>
  <rect x="14" y="7" width="1" height="1" fill="#fff" opacity="0.6"/>
  <rect x="55" y="4" width="1" height="1" fill="#9fe8ff" opacity="0.7"/>
  <rect x="60" y="10" width="1" height="1" fill="#fff" opacity="0.5"/>
  <rect x="38" y="5" width="1" height="1" fill="#00e8a0" opacity="0.6"/>
  <!-- Ground with circuit glow -->
  <rect x="0" y="56" width="64" height="8" fill="#1f2c4a"/>
  <rect x="0" y="56" width="64" height="1" fill="#3a78d8" opacity="0.5"/>
  <!-- Building body - glass dark blue -->
  <rect x="8" y="14" width="48" height="44" fill="#1a2a4a"/>
  <!-- Circuit trace lines on facade -->
  <rect x="8" y="20" width="48" height="1" fill="#9fe8ff" opacity="0.5"/>
  <rect x="8" y="28" width="48" height="1" fill="#9fe8ff" opacity="0.4"/>
  <rect x="8" y="36" width="48" height="1" fill="#9fe8ff" opacity="0.5"/>
  <rect x="8" y="44" width="48" height="1" fill="#9fe8ff" opacity="0.4"/>
  <rect x="8" y="52" width="48" height="1" fill="#9fe8ff" opacity="0.3"/>
  <!-- Vertical circuit traces -->
  <rect x="16" y="14" width="1" height="44" fill="#3a5a8a" opacity="0.5"/>
  <rect x="28" y="14" width="1" height="44" fill="#9fe8ff" opacity="0.3"/>
  <rect x="40" y="14" width="1" height="44" fill="#3a5a8a" opacity="0.5"/>
  <rect x="52" y="14" width="1" height="44" fill="#3a5a8a" opacity="0.4"/>
  <!-- Roof accent -->
  <rect x="6" y="10" width="52" height="6" fill="#1f3548"/>
  <rect x="6" y="10" width="52" height="2" fill="#3a78d8"/>
  <!-- Windows with blinking lights -->
  <rect x="11" y="17" width="5" height="4" fill="#9fe8ff" opacity="0.7"/>
  <rect x="19" y="17" width="5" height="4" fill="#00e8a0" opacity="0.8"/>
  <rect x="27" y="17" width="5" height="4" fill="#9fe8ff" opacity="0.5"/>
  <rect x="35" y="17" width="5" height="4" fill="#3a78d8" opacity="0.9"/>
  <rect x="43" y="17" width="5" height="4" fill="#9fe8ff" opacity="0.7"/>
  <rect x="51" y="17" width="5" height="4" fill="#00e8a0" opacity="0.6"/>
  <rect x="11" y="24" width="5" height="4" fill="#3a78d8" opacity="0.9"/>
  <rect x="19" y="24" width="5" height="4" fill="#9fe8ff" opacity="0.5"/>
  <rect x="35" y="24" width="5" height="4" fill="#9fe8ff" opacity="0.8"/>
  <rect x="43" y="24" width="5" height="4" fill="#00e8a0" opacity="0.7"/>
  <rect x="11" y="31" width="5" height="4" fill="#9fe8ff" opacity="0.6"/>
  <rect x="27" y="31" width="5" height="4" fill="#9fe8ff" opacity="0.8"/>
  <rect x="43" y="31" width="5" height="4" fill="#3a78d8" opacity="0.9"/>
  <rect x="51" y="31" width="5" height="4" fill="#9fe8ff" opacity="0.5"/>
  <!-- AI Brain icon above door -->
  <rect x="20" y="4" width="24" height="8" fill="#0a1828"/>
  <rect x="20" y="4" width="24" height="1" fill="#9fe8ff"/>
  <!-- Neural net dots -->
  <circle cx="26" cy="8" r="1.5" fill="#9fe8ff"/>
  <circle cx="32" cy="6" r="1.5" fill="#00e8a0"/>
  <circle cx="38" cy="8" r="1.5" fill="#9fe8ff"/>
  <line x1="26" y1="8" x2="32" y2="6" stroke="#9fe8ff" stroke-width="0.5" opacity="0.7"/>
  <line x1="32" y1="6" x2="38" y2="8" stroke="#9fe8ff" stroke-width="0.5" opacity="0.7"/>
  <!-- Door -->
  <rect x="24" y="48" width="16" height="10" fill="#0a1828"/>
  <rect x="25" y="49" width="14" height="8" fill="#1a3048"/>
  <rect x="24" y="48" width="16" height="1" fill="#9fe8ff"/>
  <!-- Floor glow -->
  <rect x="8" y="55" width="48" height="1" fill="#9fe8ff" opacity="0.3"/>
</svg>
