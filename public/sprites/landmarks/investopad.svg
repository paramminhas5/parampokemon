<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Purple dusk sky -->
  <rect width="64" height="64" fill="#1a0a28"/>
  <rect width="64" height="24" fill="#2a1040"/>
  <!-- Stars -->
  <rect x="6" y="4" width="1" height="1" fill="#f0c4ff" opacity="0.6"/>
  <rect x="20" y="8" width="1" height="1" fill="#fff" opacity="0.4"/>
  <rect x="50" y="5" width="1" height="1" fill="#f0c4ff" opacity="0.7"/>
  <rect x="58" y="12" width="1" height="1" fill="#fff" opacity="0.5"/>
  <!-- Ground - marble -->
  <rect x="0" y="58" width="64" height="6" fill="#3a2456"/>
  <rect x="0" y="58" width="64" height="1" fill="#7c5a98" opacity="0.5"/>
  <!-- Tower body - tall purple glass -->
  <rect x="18" y="10" width="28" height="50" fill="#2a1448"/>
  <!-- Neon edge accents -->
  <rect x="18" y="10" width="2" height="50" fill="#9a40c8" opacity="0.8"/>
  <rect x="44" y="10" width="2" height="50" fill="#9a40c8" opacity="0.8"/>
  <!-- Floor dividers with violet glow -->
  <rect x="18" y="18" width="28" height="1" fill="#7a40a0" opacity="0.7"/>
  <rect x="18" y="26" width="28" height="1" fill="#7a40a0" opacity="0.7"/>
  <rect x="18" y="34" width="28" height="1" fill="#7a40a0" opacity="0.7"/>
  <rect x="18" y="42" width="28" height="1" fill="#7a40a0" opacity="0.7"/>
  <rect x="18" y="50" width="28" height="1" fill="#7a40a0" opacity="0.7"/>
  <!-- Windows - warm gold interior glow -->
  <rect x="21" y="13" width="5" height="4" fill="#f0c4ff" opacity="0.8"/>
  <rect x="29" y="13" width="5" height="4" fill="#ffd280" opacity="0.9"/>
  <rect x="37" y="13" width="5" height="4" fill="#f0c4ff" opacity="0.6"/>
  <rect x="21" y="21" width="5" height="4" fill="#ffd280" opacity="0.7"/>
  <rect x="29" y="21" width="5" height="4" fill="#f0c4ff" opacity="0.9"/>
  <rect x="37" y="21" width="5" height="4" fill="#ffd280" opacity="0.8"/>
  <rect x="21" y="29" width="5" height="4" fill="#f0c4ff" opacity="0.9"/>
  <rect x="37" y="29" width="5" height="4" fill="#f0c4ff" opacity="0.7"/>
  <rect x="21" y="37" width="5" height="4" fill="#ffd280" opacity="0.8"/>
  <rect x="29" y="37" width="5" height="4" fill="#f0c4ff" opacity="0.6"/>
  <rect x="37" y="37" width="5" height="4" fill="#ffd280" opacity="0.9"/>
  <!-- Rooftop -->
  <rect x="16" y="6" width="32" height="6" fill="#3f2266"/>
  <rect x="16" y="6" width="32" height="2" fill="#9a40c8"/>
  <!-- Antenna -->
  <rect x="31" y="2" width="2" height="6" fill="#f0c4ff"/>
  <circle cx="32" cy="2" r="2" fill="#f0c4ff" opacity="0.9"/>
  <!-- Trophy emblem above door -->
  <rect x="26" y="52" width="12" height="8" fill="#f5d24a" opacity="0.9"/>
  <rect x="28" y="53" width="2" height="3" fill="#f5d24a"/>
  <rect x="34" y="53" width="2" height="3" fill="#f5d24a"/>
  <rect x="28" y="55" width="8" height="4" fill="#f5d24a"/>
  <rect x="30" y="56" width="4" height="1" fill="#c0a020"/>
  <!-- Door -->
  <rect x="26" y="54" width="12" height="6" fill="#2a1040"/>
  <rect x="27" y="55" width="10" height="4" fill="#1a0828"/>
  <!-- Purple ground glow -->
  <ellipse cx="32" cy="60" rx="20" ry="3" fill="#9a40c8" opacity="0.15"/>
</svg>
