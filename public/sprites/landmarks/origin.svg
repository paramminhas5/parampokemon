<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Warm sunset sky -->
  <rect width="64" height="64" fill="#f59b42"/>
  <rect width="64" height="30" fill="#e07832"/>
  <rect width="64" height="10" fill="#c05820"/>
  <!-- Stars/sparkles in sky -->
  <rect x="8" y="4" width="2" height="2" fill="#fff8" opacity="0.7"/>
  <rect x="52" y="6" width="2" height="2" fill="#fff" opacity="0.6"/>
  <rect x="30" y="2" width="1" height="1" fill="#fff" opacity="0.8"/>
  <!-- Ground -->
  <rect x="0" y="48" width="64" height="16" fill="#c8a060"/>
  <rect x="0" y="48" width="64" height="2" fill="#d8b070"/>
  <!-- Workshop building -->
  <rect x="6" y="26" width="36" height="24" fill="#c8924a"/>
  <!-- Roof (flat with parapet) -->
  <rect x="4" y="22" width="40" height="6" fill="#7a4d28"/>
  <rect x="4" y="22" width="40" height="2" fill="#5a3018"/>
  <!-- Window: glowing monitor -->
  <rect x="10" y="30" width="14" height="11" fill="#1a2a3a"/>
  <rect x="11" y="31" width="12" height="9" fill="#3a78d8"/>
  <rect x="12" y="32" width="10" height="2" fill="#9fe8ff"/>
  <rect x="12" y="35" width="8" height="1" fill="#7ce0ff"/>
  <rect x="12" y="37" width="6" height="1" fill="#7ce0ff"/>
  <!-- Screen glow -->
  <rect x="10" y="30" width="14" height="11" fill="#3a78d8" opacity="0.15"/>
  <!-- Door -->
  <rect x="28" y="38" width="10" height="12" fill="#5a3010"/>
  <rect x="29" y="39" width="8" height="10" fill="#4a2808"/>
  <circle cx="37" cy="45" r="1" fill="#f5d24a"/>
  <!-- Guitar leaning on wall -->
  <rect x="44" y="30" width="4" height="20" fill="#c47833"/>
  <ellipse cx="46" cy="43" rx="4" ry="5" fill="#a0602a"/>
  <rect x="45" y="28" width="2" height="5" fill="#d89040"/>
  <!-- String lights -->
  <rect x="6" y="24" width="38" height="1" fill="#888" opacity="0.6"/>
  <circle cx="10" cy="24" r="1.5" fill="#fffcaa" opacity="0.9"/>
  <circle cx="18" cy="24" r="1.5" fill="#ffb8b8" opacity="0.9"/>
  <circle cx="26" cy="24" r="1.5" fill="#fffcaa" opacity="0.9"/>
  <circle cx="34" cy="24" r="1.5" fill="#b8ffb8" opacity="0.9"/>
  <circle cx="42" cy="24" r="1.5" fill="#fffcaa" opacity="0.9"/>
  <!-- Notebook on bench -->
  <rect x="50" y="44" width="11" height="8" fill="#e8e0c0"/>
  <rect x="50" y="44" width="11" height="1" fill="#c0a870"/>
  <rect x="52" y="46" width="7" height="1" fill="#5a3a1c"/>
  <rect x="52" y="48" width="5" height="1" fill="#5a3a1c"/>
</svg>
