<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Deep navy night + aurora -->
  <rect width="64" height="64" fill="#04091c"/>
  <!-- Aurora streaks -->
  <rect x="0" y="8" width="64" height="3" fill="#3a78d8" opacity="0.2"/>
  <rect x="0" y="12" width="64" height="2" fill="#7ce0ff" opacity="0.12"/>
  <!-- Stars -->
  <rect x="5"  y="3" width="1" height="1" fill="#7ce0ff" opacity="0.8"/>
  <rect x="15" y="6" width="1" height="1" fill="#fff" opacity="0.5"/>
  <rect x="50" y="4" width="1" height="1" fill="#7ce0ff" opacity="0.7"/>
  <rect x="58" y="9" width="1" height="1" fill="#fff" opacity="0.4"/>
  <rect x="35" y="2" width="1" height="1" fill="#7ce0ff" opacity="0.6"/>
  <!-- Ground - glassy -->
  <rect x="0" y="57" width="64" height="7" fill="#081428"/>
  <rect x="0" y="57" width="64" height="1" fill="#3a78d8" opacity="0.4"/>
  <!-- Building body - dark glass -->
  <rect x="10" y="12" width="44" height="47" fill="#0d1e38"/>
  <!-- Circuit brain pattern on facade -->
  <rect x="10" y="18" width="44" height="1" fill="#3a78d8" opacity="0.5"/>
  <rect x="10" y="26" width="44" height="1" fill="#7ce0ff" opacity="0.4"/>
  <rect x="10" y="34" width="44" height="1" fill="#3a78d8" opacity="0.5"/>
  <rect x="10" y="42" width="44" height="1" fill="#7ce0ff" opacity="0.4"/>
  <rect x="10" y="50" width="44" height="1" fill="#3a78d8" opacity="0.3"/>
  <!-- Vertical glowing seams -->
  <rect x="20" y="12" width="1" height="47" fill="#3a78d8" opacity="0.3"/>
  <rect x="32" y="12" width="1" height="47" fill="#7ce0ff" opacity="0.25"/>
  <rect x="44" y="12" width="1" height="47" fill="#3a78d8" opacity="0.3"/>
  <!-- Roof edge -->
  <rect x="8" y="8" width="48" height="6" fill="#162848"/>
  <rect x="8" y="8" width="48" height="2" fill="#3a78d8"/>
  <!-- Antenna -->
  <rect x="31" y="2" width="2" height="8" fill="#7ce0ff"/>
  <circle cx="32" cy="2" r="2" fill="#7ce0ff" opacity="0.9"/>
  <!-- ∞ infinity symbol above building -->
  <rect x="23" y="4" width="5" height="1" fill="#7ce0ff" opacity="0.9"/>
  <rect x="36" y="4" width="5" height="1" fill="#7ce0ff" opacity="0.9"/>
  <rect x="22" y="3" width="2" height="3" fill="#7ce0ff" opacity="0.9"/>
  <rect x="27" y="3" width="2" height="3" fill="#7ce0ff" opacity="0.9"/>
  <rect x="35" y="3" width="2" height="3" fill="#7ce0ff" opacity="0.9"/>
  <rect x="40" y="3" width="2" height="3" fill="#7ce0ff" opacity="0.9"/>
  <!-- Windows - blue-white glow -->
  <rect x="13" y="14" width="5" height="4" fill="#7ce0ff" opacity="0.7"/>
  <rect x="21" y="14" width="5" height="4" fill="#3a78d8" opacity="0.9"/>
  <rect x="38" y="14" width="5" height="4" fill="#7ce0ff" opacity="0.8"/>
  <rect x="46" y="14" width="5" height="4" fill="#7ce0ff" opacity="0.6"/>
  <rect x="13" y="22" width="5" height="4" fill="#3a78d8" opacity="0.9"/>
  <rect x="29" y="22" width="5" height="4" fill="#7ce0ff" opacity="0.9"/>
  <rect x="46" y="22" width="5" height="4" fill="#3a78d8" opacity="0.7"/>
  <rect x="13" y="30" width="5" height="4" fill="#7ce0ff" opacity="0.8"/>
  <rect x="21" y="30" width="5" height="4" fill="#7ce0ff" opacity="0.5"/>
  <rect x="38" y="30" width="5" height="4" fill="#3a78d8" opacity="0.9"/>
  <rect x="13" y="38" width="5" height="4" fill="#3a78d8" opacity="0.7"/>
  <rect x="29" y="38" width="5" height="4" fill="#7ce0ff" opacity="0.9"/>
  <rect x="46" y="38" width="5" height="4" fill="#7ce0ff" opacity="0.8"/>
  <rect x="21" y="46" width="5" height="4" fill="#7ce0ff" opacity="0.6"/>
  <rect x="38" y="46" width="5" height="4" fill="#3a78d8" opacity="0.8"/>
  <!-- Grand entrance -->
  <rect x="24" y="52" width="16" height="8" fill="#081428"/>
  <rect x="25" y="53" width="14" height="6" fill="#0d1e38"/>
  <rect x="24" y="52" width="16" height="1" fill="#7ce0ff" opacity="0.6"/>
  <!-- Cyan floor glow -->
  <ellipse cx="32" cy="59" rx="22" ry="2" fill="#7ce0ff" opacity="0.1"/>
</svg>
