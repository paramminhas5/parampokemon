<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="48" height="64" fill="#d4e8c0"/>
  <!-- Legs -->
  <rect x="16" y="52" width="6" height="10" fill="#3a2a10"/>
  <rect x="26" y="52" width="6" height="10" fill="#3a2a10"/>
  <!-- Shoes -->
  <rect x="14" y="58" width="8" height="4" fill="#1a1a1a"/>
  <rect x="26" y="58" width="8" height="4" fill="#1a1a1a"/>
  <!-- Pants -->
  <rect x="14" y="44" width="20" height="10" fill="#5a4020"/>
  <rect x="14" y="44" width="2" height="10" fill="#6a5030"/>
  <!-- Yellow price-tag belt -->
  <rect x="14" y="42" width="20" height="4" fill="#f0c030"/>
  <rect x="20" y="42" width="4" height="4" fill="#e0a000"/>
  <rect x="21" y="43" width="2" height="2" fill="#ffd040"/>
  <!-- Price tag details on belt -->
  <rect x="15" y="43" width="3" height="2" fill="#e0b020"/>
  <rect x="30" y="43" width="3" height="2" fill="#e0b020"/>
  <!-- Green vest body -->
  <rect x="12" y="24" width="24" height="20" fill="#4a9a3a"/>
  <!-- Vest highlights -->
  <rect x="12" y="24" width="2" height="20" fill="#5aaa4a"/>
  <rect x="34" y="24" width="2" height="20" fill="#3a8a2a"/>
  <!-- Vest collar/lapel -->
  <rect x="20" y="24" width="8" height="12" fill="#e8c098"/>
  <rect x="18" y="24" width="4" height="8" fill="#4a9a3a"/>
  <rect x="26" y="24" width="4" height="8" fill="#4a9a3a"/>
  <!-- Shirt underneath -->
  <rect x="20" y="24" width="8" height="18" fill="#f0e8d0"/>
  <!-- Vest buttons -->
  <rect x="23" y="30" width="2" height="2" fill="#2a6a1a"/>
  <rect x="23" y="34" width="2" height="2" fill="#2a6a1a"/>
  <rect x="23" y="38" width="2" height="2" fill="#2a6a1a"/>
  <!-- Left arm -->
  <rect x="4" y="26" width="10" height="6" fill="#4a9a3a"/>
  <rect x="4" y="32" width="10" height="10" fill="#e8c098"/>
  <!-- Right arm holding golden ledger -->
  <rect x="34" y="26" width="10" height="6" fill="#4a9a3a"/>
  <rect x="34" y="32" width="10" height="10" fill="#e8c098"/>
  <!-- Golden ledger/book -->
  <rect x="36" y="36" width="12" height="16" fill="#f0c030"/>
  <rect x="36" y="36" width="12" height="2" fill="#ffd040"/>
  <rect x="36" y="36" width="2" height="16" fill="#ffd040"/>
  <rect x="46" y="36" width="2" height="16" fill="#d0a000"/>
  <rect x="36" y="50" width="12" height="2" fill="#d0a000"/>
  <!-- Ledger lines -->
  <rect x="38" y="40" width="8" height="1" fill="#c09000"/>
  <rect x="38" y="43" width="8" height="1" fill="#c09000"/>
  <rect x="38" y="46" width="8" height="1" fill="#c09000"/>
  <!-- Neck -->
  <rect x="20" y="18" width="8" height="8" fill="#e8c098"/>
  <!-- Head -->
  <rect x="14" y="6" width="20" height="16" fill="#e8c098"/>
  <!-- Head shading -->
  <rect x="14" y="6" width="2" height="16" fill="#d8b088"/>
  <rect x="32" y="6" width="2" height="16" fill="#d8b088"/>
  <!-- Hair - dark brown, energetic spiky -->
  <rect x="14" y="4" width="20" height="6" fill="#3a2010"/>
  <rect x="12" y="6" width="4" height="4" fill="#3a2010"/>
  <rect x="32" y="5" width="4" height="5" fill="#3a2010"/>
  <rect x="18" y="2" width="4" height="4" fill="#4a3020"/>
  <rect x="26" y="3" width="4" height="3" fill="#4a3020"/>
  <rect x="22" y="1" width="4" height="4" fill="#3a2010"/>
  <!-- Eyes - friendly/wide -->
  <rect x="17" y="11" width="5" height="5" fill="#ffffff"/>
  <rect x="26" y="11" width="5" height="5" fill="#ffffff"/>
  <rect x="18" y="12" width="3" height="3" fill="#3a2010"/>
  <rect x="27" y="12" width="3" height="3" fill="#3a2010"/>
  <rect x="19" y="13" width="1" height="1" fill="#ffffff"/>
  <rect x="28" y="13" width="1" height="1" fill="#ffffff"/>
  <!-- Eyebrows - raised friendly -->
  <rect x="17" y="10" width="5" height="1" fill="#3a2010"/>
  <rect x="26" y="10" width="5" height="1" fill="#3a2010"/>
  <!-- Big smile -->
  <rect x="18" y="18" width="12" height="2" fill="#c07050"/>
  <rect x="16" y="17" width="2" height="2" fill="#c07050"/>
  <rect x="30" y="17" width="2" height="2" fill="#c07050"/>
  <rect x="20" y="20" width="8" height="1" fill="#e08060"/>
  <!-- Teeth -->
  <rect x="19" y="18" width="10" height="1" fill="#ffffff"/>
  <!-- Rosy cheeks -->
  <rect x="15" y="15" width="3" height="2" fill="#e8a090" opacity="0.7"/>
  <rect x="30" y="15" width="3" height="2" fill="#e8a090" opacity="0.7"/>
</svg>
