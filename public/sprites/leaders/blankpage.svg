<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Dark background -->
  <rect width="48" height="64" fill="#1a1a2e"/>
  <!-- Misty aura glow -->
  <rect x="10" y="8" width="28" height="50" fill="#2a2a4a" opacity="0.5"/>
  <rect x="14" y="6" width="20" height="52" fill="#3a3a5a" opacity="0.3"/>
  <!-- Dark cape/cloak body -->
  <rect x="8" y="28" width="32" height="30" fill="#2a2a2a"/>
  <rect x="6" y="32" width="4" height="24" fill="#2a2a2a"/>
  <rect x="38" y="32" width="4" height="24" fill="#2a2a2a"/>
  <!-- Cape shading/highlights -->
  <rect x="10" y="30" width="2" height="26" fill="#3a3a3a"/>
  <rect x="36" y="30" width="2" height="26" fill="#3a3a3a"/>
  <rect x="12" y="28" width="24" height="2" fill="#3a3a3a"/>
  <!-- Cape bottom taper -->
  <rect x="8" y="56" width="4" height="4" fill="#2a2a2a"/>
  <rect x="36" y="56" width="4" height="4" fill="#2a2a2a"/>
  <rect x="12" y="58" width="6" height="2" fill="#1a1a1a"/>
  <rect x="30" y="58" width="6" height="2" fill="#1a1a1a"/>
  <!-- Ghost-white neck -->
  <rect x="20" y="22" width="8" height="8" fill="#e0e0e0"/>
  <!-- Head - ghost white -->
  <rect x="14" y="8" width="20" height="18" fill="#f0f0f0"/>
  <!-- Head shading -->
  <rect x="14" y="8" width="2" height="18" fill="#d8d8d8"/>
  <rect x="32" y="8" width="2" height="18" fill="#d8d8d8"/>
  <rect x="14" y="24" width="20" height="2" fill="#d8d8d8"/>
  <!-- Crimson beret -->
  <rect x="12" y="6" width="24" height="6" fill="#c03030"/>
  <rect x="10" y="8" width="4" height="4" fill="#c03030"/>
  <rect x="34" y="8" width="4" height="2" fill="#c03030"/>
  <!-- Beret highlight -->
  <rect x="14" y="6" width="10" height="2" fill="#d84040"/>
  <!-- Beret pompom -->
  <rect x="21" y="4" width="6" height="4" fill="#e04040"/>
  <rect x="22" y="3" width="4" height="2" fill="#c03030"/>
  <!-- Eyes - dark hollow -->
  <rect x="17" y="14" width="4" height="4" fill="#2a2a2a"/>
  <rect x="27" y="14" width="4" height="4" fill="#2a2a2a"/>
  <!-- Eye glow (ghostly) -->
  <rect x="18" y="15" width="2" height="2" fill="#aaaacc"/>
  <rect x="28" y="15" width="2" height="2" fill="#aaaacc"/>
  <!-- Pale mouth -->
  <rect x="19" y="20" width="10" height="2" fill="#c0b0b0"/>
  <!-- Canvas (shield) - white blank -->
  <rect x="30" y="30" width="14" height="18" fill="#ffffff"/>
  <rect x="30" y="30" width="14" height="2" fill="#e8e8e8"/>
  <rect x="30" y="30" width="2" height="18" fill="#e8e8e8"/>
  <rect x="42" y="30" width="2" height="18" fill="#d0d0d0"/>
  <rect x="30" y="46" width="14" height="2" fill="#d0d0d0"/>
  <!-- Canvas frame -->
  <rect x="28" y="28" width="2" height="22" fill="#5a3a1a"/>
  <rect x="28" y="28" width="16" height="2" fill="#5a3a1a"/>
  <rect x="44" y="28" width="2" height="22" fill="#3a2a10"/>
  <rect x="28" y="48" width="18" height="2" fill="#3a2a10"/>
  <!-- Arm holding canvas -->
  <rect x="26" y="32" width="4" height="14" fill="#e0e0e0"/>
  <!-- Floating misty wisps -->
  <rect x="6" y="20" width="4" height="2" fill="#c0c0e0" opacity="0.6"/>
  <rect x="4" y="24" width="2" height="2" fill="#c0c0e0" opacity="0.4"/>
  <rect x="40" y="18" width="4" height="2" fill="#c0c0e0" opacity="0.6"/>
  <rect x="42" y="22" width="2" height="2" fill="#c0c0e0" opacity="0.4"/>
</svg>
