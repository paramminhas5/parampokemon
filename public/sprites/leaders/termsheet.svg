<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Dark background -->
  <rect width="48" height="64" fill="#18182a"/>
  <!-- Shoes - polished black -->
  <rect x="15" y="58" width="7" height="4" fill="#0a0a18"/>
  <rect x="26" y="58" width="7" height="4" fill="#0a0a18"/>
  <rect x="16" y="58" width="3" height="1" fill="#2a2a3a"/>
  <rect x="27" y="58" width="3" height="1" fill="#2a2a3a"/>
  <!-- Pants - near-black -->
  <rect x="15" y="44" width="7" height="16" fill="#1a1a28"/>
  <rect x="26" y="44" width="7" height="16" fill="#1a1a28"/>
  <!-- Pants crease highlight -->
  <rect x="17" y="44" width="1" height="16" fill="#2a2a38"/>
  <rect x="28" y="44" width="1" height="16" fill="#2a2a38"/>
  <!-- Near-black suit jacket -->
  <rect x="11" y="22" width="26" height="24" fill="#1a1a28"/>
  <!-- Jacket shading -->
  <rect x="11" y="22" width="2" height="24" fill="#2a2a3a"/>
  <rect x="35" y="22" width="2" height="24" fill="#0a0a18"/>
  <!-- White shirt -->
  <rect x="20" y="22" width="8" height="18" fill="#f0f0f0"/>
  <!-- Lapels -->
  <rect x="18" y="22" width="4" height="14" fill="#1a1a28"/>
  <rect x="26" y="22" width="4" height="14" fill="#1a1a28"/>
  <rect x="19" y="22" width="2" height="10" fill="#2a2a3a"/>
  <rect x="27" y="22" width="2" height="10" fill="#2a2a3a"/>
  <!-- Dark tie -->
  <rect x="22" y="24" width="4" height="14" fill="#0a0a18"/>
  <rect x="23" y="24" width="2" height="14" fill="#1a1a28"/>
  <!-- Pink pocket square -->
  <rect x="12" y="25" width="5" height="4" fill="#ff9fd4"/>
  <rect x="13" y="24" width="3" height="2" fill="#ff80c0"/>
  <rect x="12" y="26" width="2" height="2" fill="#ff80c0"/>
  <!-- Suit buttons -->
  <rect x="23" y="34" width="2" height="2" fill="#2a2a3a"/>
  <rect x="23" y="38" width="2" height="2" fill="#2a2a3a"/>
  <!-- Left arm -->
  <invoke name="rect" x="3" y="24" width="10" height="18" fill="#1a1a28"/>
  <rect x="3" y="24" width="10" height="18" fill="#1a1a28"/>
  <rect x="3" y="42" width="10" height="6" fill="#d4a878"/>
  <!-- Cufflinks left -->
  <rect x="4" y="41" width="8" height="2" fill="#f0c030"/>
  <!-- Right arm holding document -->
  <rect x="35" y="24" width="10" height="18" fill="#1a1a28"/>
  <rect x="35" y="42" width="10" height="6" fill="#d4a878"/>
  <!-- Cufflinks right -->
  <rect x="36" y="41" width="8" height="2" fill="#f0c030"/>
  <!-- White document/term sheet -->
  <rect x="34" y="38" width="14" height="18" fill="#f8f8f8"/>
  <rect x="34" y="38" width="14" height="2" fill="#e8e8e8"/>
  <rect x="34" y="38" width="1" height="18" fill="#e0e0e0"/>
  <!-- Document text lines -->
  <rect x="36" y="42" width="10" height="1" fill="#3a3a4a"/>
  <rect x="36" y="45" width="10" height="1" fill="#3a3a4a"/>
  <rect x="36" y="48" width="7" height="1" fill="#3a3a4a"/>
  <rect x="36" y="51" width="10" height="1" fill="#3a3a4a"/>
  <rect x="36" y="54" width="8" height="1" fill="#3a3a4a"/>
  <!-- Signature line -->
  <rect x="36" y="53" width="10" height="1" fill="#cccccc"/>
  <!-- Neck -->
  <rect x="20" y="16" width="8" height="8" fill="#d4a878"/>
  <!-- Head -->
  <rect x="14" y="4" width="20" height="16" fill="#d4a878"/>
  <!-- Head shading -->
  <rect x="14" y="4" width="2" height="16" fill="#c49868"/>
  <rect x="32" y="4" width="2" height="16" fill="#c49868"/>
  <!-- Hair - dark slicked back -->
  <rect x="14" y="4" width="20" height="5" fill="#1a1a18"/>
  <rect x="12" y="6" width="3" height="4" fill="#1a1a18"/>
  <rect x="33" y="5" width="3" height="3" fill="#1a1a18"/>
  <!-- Hair sheen -->
  <rect x="16" y="4" width="6" height="2" fill="#2a2a28"/>
  <!-- Dark-framed glasses -->
  <rect x="15" y="12" width="7" height="5" fill="none"/>
  <rect x="15" y="12" width="7" height="1" fill="#1a1a18"/>
  <rect x="15" y="16" width="7" height="1" fill="#1a1a18"/>
  <rect x="15" y="12" width="1" height="5" fill="#1a1a18"/>
  <rect x="21" y="12" width="1" height="5" fill="#1a1a18"/>
  <rect x="26" y="12" width="7" height="1" fill="#1a1a18"/>
  <rect x="26" y="16" width="7" height="1" fill="#1a1a18"/>
  <rect x="26" y="12" width="1" height="5" fill="#1a1a18"/>
  <rect x="32" y="12" width="1" height="5" fill="#1a1a18"/>
  <!-- Glasses bridge -->
  <rect x="22" y="14" width="4" height="1" fill="#1a1a18"/>
  <!-- Glasses arms -->
  <rect x="13" y="13" width="2" height="1" fill="#1a1a18"/>
  <rect x="33" y="13" width="2" height="1" fill="#1a1a18"/>
  <!-- Eyes behind glasses -->
  <rect x="16" y="13" width="5" height="3" fill="#e8f8e8"/>
  <rect x="27" y="13" width="5" height="3" fill="#e8f8e8"/>
  <rect x="17" y="13" width="3" height="3" fill="#1a2a1a"/>
  <rect x="28" y="13" width="3" height="3" fill="#1a2a1a"/>
  <rect x="17" y="13" width="1" height="1" fill="#ffffff"/>
  <rect x="28" y="13" width="1" height="1" fill="#ffffff"/>
  <!-- Sharp thin brows -->
  <rect x="15" y="11" width="7" height="1" fill="#1a1a18"/>
  <rect x="26" y="11" width="7" height="1" fill="#1a1a18"/>
  <!-- Neutral/slight smirk mouth -->
  <rect x="19" y="19" width="10" height="2" fill="#a07858"/>
  <rect x="21" y="18" width="6" height="1" fill="#a07858"/>
  <rect x="27" y="19" width="3" height="1" fill="#b08868"/>
</svg>
