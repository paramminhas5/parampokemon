<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Deep dark background -->
  <rect width="48" height="64" fill="#020810"/>
  <!-- Atmospheric dark glow -->
  <rect x="8" y="4" width="32" height="56" fill="#0a1020" opacity="0.8"/>
  <!-- Dark navy cloak - wide, flowing -->
  <!-- Cloak base -->
  <rect x="6" y="22" width="36" height="40" fill="#0a1020"/>
  <!-- Cloak sides tapering at bottom -->
  <rect x="4" y="30" width="6" height="28" fill="#0a1020"/>
  <rect x="38" y="30" width="6" height="28" fill="#0a1020"/>
  <!-- Bottom taper -->
  <rect x="4" y="54" width="6" height="4" fill="#060c18"/>
  <rect x="38" y="54" width="6" height="4" fill="#060c18"/>
  <rect x="6" y="58" width="36" height="4" fill="#060c18"/>
  <rect x="8" y="60" width="32" height="2" fill="#020810"/>
  <rect x="12" y="62" width="24" height="2" fill="#020810"/>
  <!-- Cloak shading/depth -->
  <rect x="6" y="22" width="3" height="40" fill="#121830"/>
  <rect x="39" y="22" width="3" height="40" fill="#060e1c"/>
  <!-- Cloak inner shadow -->
  <rect x="10" y="24" width="28" height="36" fill="#08101e" opacity="0.5"/>
  <!-- Hood - same dark navy, wide -->
  <rect x="8" y="4" width="32" height="22" fill="#0a1020"/>
  <!-- Hood shading -->
  <rect x="8" y="4" width="4" height="22" fill="#121830"/>
  <rect x="36" y="4" width="4" height="22" fill="#060e1c"/>
  <!-- Hood inner shadow (face area) -->
  <rect x="12" y="8" width="24" height="18" fill="#04080f"/>
  <!-- Deep shadow over face - only eyes visible -->
  <rect x="12" y="6" width="24" height="20" fill="#020810" opacity="0.85"/>
  <!-- GLOWING GREEN EYES - the only visible feature -->
  <!-- Left eye outer glow -->
  <rect x="14" y="14" width="8" height="6" fill="#00e8a0" opacity="0.3"/>
  <rect x="15" y="13" width="6" height="8" fill="#00e8a0" opacity="0.2"/>
  <!-- Left eye main -->
  <rect x="15" y="14" width="6" height="5" fill="#00e8a0"/>
  <rect x="16" y="15" width="4" height="3" fill="#00ff99"/>
  <rect x="17" y="15" width="2" height="3" fill="#80ffcc"/>
  <!-- Right eye outer glow -->
  <rect x="26" y="14" width="8" height="6" fill="#00e8a0" opacity="0.3"/>
  <rect x="25" y="13" width="6" height="8" fill="#00e8a0" opacity="0.2"/>
  <!-- Right eye main -->
  <rect x="27" y="14" width="6" height="5" fill="#00e8a0"/>
  <rect x="28" y="15" width="4" height="3" fill="#00ff99"/>
  <rect x="29" y="15" width="2" height="3" fill="#80ffcc"/>
  <!-- Green stock ticker on chest -->
  <rect x="14" y="36" width="20" height="10" fill="#00e8a0" opacity="0.15"/>
  <rect x="14" y="36" width="20" height="1" fill="#00e8a0" opacity="0.6"/>
  <rect x="14" y="45" width="20" height="1" fill="#00e8a0" opacity="0.6"/>
  <rect x="14" y="36" width="1" height="10" fill="#00e8a0" opacity="0.6"/>
  <rect x="33" y="36" width="1" height="10" fill="#00e8a0" opacity="0.6"/>
  <!-- Ticker text-like pixel lines -->
  <rect x="15" y="38" width="3" height="1" fill="#00e8a0"/>
  <rect x="15" y="40" width="5" height="1" fill="#00e8a0"/>
  <rect x="15" y="42" width="2" height="1" fill="#00e8a0"/>
  <rect x="15" y="44" width="4" height="1" fill="#00e8a0"/>
  <rect x="20" y="38" width="4" height="1" fill="#00e8a0"/>
  <rect x="20" y="40" width="2" height="1" fill="#00e8a0"/>
  <rect x="20" y="42" width="6" height="1" fill="#00e8a0"/>
  <rect x="20" y="44" width="3" height="1" fill="#00e8a0"/>
  <rect x="26" y="38" width="6" height="1" fill="#00e8a0"/>
  <rect x="26" y="40" width="4" height="1" fill="#00e8a0"/>
  <rect x="26" y="42" width="5" height="1" fill="#00e8a0"/>
  <rect x="26" y="44" width="6" height="1" fill="#00e8a0"/>
  <!-- Up arrow indicator -->
  <rect x="30" y="37" width="2" height="3" fill="#00e8a0"/>
  <rect x="29" y="38" width="4" height="1" fill="#00e8a0"/>
  <rect x="28" y="39" width="6" height="1" fill="#00e8a0"/>
  <!-- Subtle cloak texture -->
  <rect x="16" y="28" width="2" height="6" fill="#0f1828" opacity="0.5"/>
  <rect x="30" y="26" width="2" height="8" fill="#0f1828" opacity="0.5"/>
  <rect x="22" y="50" width="4" height="4" fill="#0f1828" opacity="0.5"/>
</svg>
