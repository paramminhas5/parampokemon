<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Background - bright lab -->
  <rect width="48" height="64" fill="#e8f4ff"/>
  <!-- Shoes -->
  <rect x="15" y="58" width="7" height="4" fill="#2a2a4a"/>
  <rect x="26" y="58" width="7" height="4" fill="#2a2a4a"/>
  <!-- Pants - dark blue -->
  <rect x="15" y="46" width="7" height="14" fill="#2a3a6a"/>
  <rect x="26" y="46" width="7" height="14" fill="#2a3a6a"/>
  <!-- Pants highlight -->
  <rect x="16" y="46" width="2" height="14" fill="#3a4a7a"/>
  <!-- Lab coat body - white -->
  <rect x="11" y="24" width="26" height="24" fill="#f8f8f8"/>
  <!-- Lab coat shading -->
  <rect x="11" y="24" width="2" height="24" fill="#e8e8e8"/>
  <rect x="35" y="24" width="2" height="24" fill="#d8d8d8"/>
  <!-- Lab coat lapels -->
  <rect x="20" y="24" width="8" height="16" fill="#f0f0f0"/>
  <rect x="18" y="24" width="4" height="12" fill="#f8f8f8"/>
  <rect x="26" y="24" width="4" height="12" fill="#f8f8f8"/>
  <!-- Blue bowtie -->
  <rect x="20" y="25" width="8" height="5" fill="#2a6ab8"/>
  <rect x="23" y="26" width="2" height="3" fill="#1a5aa8"/>
  <rect x="20" y="25" width="3" height="2" fill="#4a8ad8"/>
  <rect x="25" y="27" width="3" height="2" fill="#4a8ad8"/>
  <rect x="20" y="27" width="3" height="2" fill="#1a5aa8"/>
  <rect x="25" y="25" width="3" height="2" fill="#1a5aa8"/>
  <!-- Shirt under coat -->
  <rect x="21" y="28" width="6" height="12" fill="#e8f0ff"/>
  <!-- Coat pocket with pen -->
  <rect x="12" y="32" width="6" height="5" fill="#e8e8e8"/>
  <rect x="12" y="32" width="6" height="1" fill="#d0d0d0"/>
  <rect x="14" y="29" width="1" height="5" fill="#2a6ab8"/>
  <rect x="16" y="30" width="1" height="4" fill="#c03030"/>
  <!-- Coat buttons -->
  <rect x="23" y="34" width="2" height="2" fill="#d0d0d0"/>
  <rect x="23" y="38" width="2" height="2" fill="#d0d0d0"/>
  <rect x="23" y="42" width="2" height="2" fill="#d0d0d0"/>
  <!-- Left arm -->
  <rect x="3" y="26" width="10" height="18" fill="#f8f8f8"/>
  <rect x="3" y="44" width="10" height="6" fill="#f0d8b8"/>
  <!-- Right arm holding test tube -->
  <rect x="35" y="26" width="10" height="18" fill="#f8f8f8"/>
  <rect x="35" y="44" width="10" height="6" fill="#f0d8b8"/>
  <!-- Glowing test tube -->
  <rect x="41" y="32" width="5" height="16" fill="#9fe8ff"/>
  <rect x="41" y="32" width="5" height="3" fill="#70c8e0"/>
  <rect x="42" y="35" width="3" height="10" fill="#c8f4ff"/>
  <!-- Test tube cap -->
  <rect x="40" y="30" width="7" height="4" fill="#d0d0d0"/>
  <rect x="41" y="29" width="5" height="2" fill="#e0e0e0"/>
  <!-- Glow effect around tube -->
  <rect x="39" y="34" width="2" height="8" fill="#9fe8ff" opacity="0.4"/>
  <rect x="46" y="34" width="2" height="8" fill="#9fe8ff" opacity="0.4"/>
  <!-- Neck -->
  <rect x="20" y="18" width="8" height="8" fill="#f0d8b8"/>
  <!-- Head -->
  <rect x="14" y="6" width="20" height="16" fill="#f0d8b8"/>
  <!-- Head shading -->
  <rect x="14" y="6" width="2" height="16" fill="#e0c8a8"/>
  <rect x="32" y="6" width="2" height="16" fill="#e0c8a8"/>
  <!-- Hair - messy brown -->
  <rect x="14" y="4" width="20" height="6" fill="#6a4820"/>
  <rect x="12" y="6" width="3" height="4" fill="#6a4820"/>
  <rect x="33" y="5" width="3" height="4" fill="#6a4820"/>
  <rect x="20" y="2" width="3" height="4" fill="#7a5830"/>
  <rect x="26" y="3" width="3" height="3" fill="#7a5830"/>
  <!-- Cyan goggles on forehead -->
  <rect x="14" y="8" width="20" height="5" fill="#9fe8ff"/>
  <rect x="14" y="8" width="8" height="5" fill="#70c8e0"/>
  <rect x="22" y="8" width="2" height="5" fill="#5a9ab8"/>
  <rect x="24" y="8" width="8" height="5" fill="#70c8e0"/>
  <!-- Goggles strap -->
  <rect x="12" y="9" width="2" height="3" fill="#3a3a3a"/>
  <rect x="34" y="9" width="2" height="3" fill="#3a3a3a"/>
  <!-- Goggles shine -->
  <rect x="15" y="9" width="3" height="2" fill="#c8f4ff"/>
  <rect x="25" y="9" width="3" height="2" fill="#c8f4ff"/>
  <!-- Eyes - excited wide open -->
  <rect x="16" y="14" width="6" height="6" fill="#ffffff"/>
  <rect x="26" y="14" width="6" height="6" fill="#ffffff"/>
  <rect x="17" y="15" width="4" height="4" fill="#3a6ab8"/>
  <rect x="27" y="15" width="4" height="4" fill="#3a6ab8"/>
  <rect x="18" y="16" width="2" height="2" fill="#1a3a88"/>
  <rect x="28" y="16" width="2" height="2" fill="#1a3a88"/>
  <rect x="18" y="15" width="1" height="1" fill="#ffffff"/>
  <rect x="28" y="15" width="1" height="1" fill="#ffffff"/>
  <!-- Excited eyebrows raised high -->
  <rect x="16" y="13" width="6" height="1" fill="#6a4820"/>
  <rect x="26" y="13" width="6" height="1" fill="#6a4820"/>
  <!-- Excited open smile -->
  <rect x="18" y="20" width="12" height="3" fill="#c07858"/>
  <rect x="19" y="20" width="10" height="2" fill="#d08868"/>
  <rect x="19" y="20" width="10" height="1" fill="#e8f0ff"/>
  <!-- Teeth -->
  <rect x="20" y="21" width="8" height="1" fill="#ffffff"/>
</svg>
