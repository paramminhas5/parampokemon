<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Office background -->
  <rect width="48" height="64" fill="#d8e0e8"/>
  <!-- Shoes -->
  <rect x="15" y="58" width="7" height="4" fill="#2a2a1a"/>
  <rect x="26" y="58" width="7" height="4" fill="#2a2a1a"/>
  <rect x="16" y="58" width="3" height="1" fill="#3a3a2a"/>
  <rect x="27" y="58" width="3" height="1" fill="#3a3a2a"/>
  <!-- Pants - dark charcoal -->
  <rect x="15" y="44" width="7" height="16" fill="#3a3a4a"/>
  <rect x="26" y="44" width="7" height="16" fill="#3a3a4a"/>
  <!-- Deep blue dress shirt -->
  <rect x="11" y="22" width="26" height="24" fill="#2a4a8a"/>
  <!-- Shirt shading -->
  <rect x="11" y="22" width="2" height="24" fill="#3a5a9a"/>
  <rect x="35" y="22" width="2" height="24" fill="#1a3a7a"/>
  <!-- Shirt buttons down center -->
  <rect x="23" y="26" width="2" height="16" fill="#1a3a7a"/>
  <rect x="23" y="26" width="2" height="2" fill="#f0f0e0"/>
  <rect x="23" y="30" width="2" height="2" fill="#f0f0e0"/>
  <rect x="23" y="34" width="2" height="2" fill="#f0f0e0"/>
  <rect x="23" y="38" width="2" height="2" fill="#f0f0e0"/>
  <!-- Rolled up sleeves - showing frustration -->
  <rect x="11" y="22" width="26" height="6" fill="#2a4a8a"/>
  <rect x="11" y="28" width="4" height="4" fill="#3a5a9a"/>
  <rect x="33" y="28" width="4" height="4" fill="#3a5a9a"/>
  <!-- Sleeve rolls -->
  <rect x="11" y="30" width="4" height="2" fill="#1a3a7a"/>
  <rect x="33" y="30" width="4" height="2" fill="#1a3a7a"/>
  <!-- Red tie - slightly loosened -->
  <rect x="21" y="22" width="6" height="16" fill="#e83a3a"/>
  <rect x="22" y="22" width="4" height="16" fill="#c82020"/>
  <!-- Tie knot -->
  <rect x="21" y="22" width="6" height="4" fill="#d02828"/>
  <rect x="22" y="22" width="4" height="2" fill="#e83a3a"/>
  <!-- Tie loosened - diagonal -->
  <rect x="22" y="36" width="5" height="3" fill="#e83a3a"/>
  <rect x="23" y="39" width="4" height="3" fill="#c82020"/>
  <!-- Left arm up/raised in frustration -->
  <rect x="3" y="20" width="10" height="16" fill="#2a4a8a"/>
  <rect x="3" y="36" width="10" height="8" fill="#e0b888"/>
  <!-- Left hand pointing/gesturing -->
  <rect x="1" y="36" width="4" height="4" fill="#e0b888"/>
  <rect x="0" y="36" width="3" height="2" fill="#e0b888"/>
  <!-- Right arm holding clipboard -->
  <rect x="35" y="22" width="10" height="18" fill="#2a4a8a"/>
  <rect x="35" y="40" width="10" height="8" fill="#e0b888"/>
  <!-- Tan clipboard - gripped tight to chest -->
  <rect x="32" y="26" width="14" height="18" fill="#c8a870"/>
  <!-- Clipboard top clip -->
  <rect x="36" y="24" width="6" height="4" fill="#8a7050"/>
  <rect x="37" y="23" width="4" height="3" fill="#a08060"/>
  <rect x="38" y="22" width="2" height="3" fill="#c0a080"/>
  <!-- Clipboard paper -->
  <rect x="33" y="29" width="12" height="14" fill="#f5f0e0"/>
  <rect x="33" y="29" width="12" height="1" fill="#e8e0c8"/>
  <!-- Paper lines - partially filled out then scribbled -->
  <rect x="34" y="31" width="10" height="1" fill="#9a9070"/>
  <rect x="34" y="33" width="6" height="1" fill="#9a9070"/>
  <rect x="34" y="35" width="10" height="1" fill="#9a9070"/>
  <rect x="34" y="37" width="8" height="1" fill="#9a9070"/>
  <!-- Scribbles - the brief is confusing -->
  <rect x="34" y="39" width="10" height="1" fill="#c03030"/>
  <rect x="35" y="40" width="8" height="1" fill="#c03030"/>
  <!-- Clipboard border -->
  <rect x="32" y="26" width="1" height="18" fill="#8a7050"/>
  <rect x="45" y="26" width="1" height="18" fill="#7a6040"/>
  <rect x="32" y="43" width="14" height="1" fill="#7a6040"/>
  <!-- Neck -->
  <rect x="20" y="16" width="8" height="8" fill="#e0b888"/>
  <!-- Head -->
  <rect x="14" y="4" width="20" height="16" fill="#e0b888"/>
  <!-- Head shading -->
  <rect x="14" y="4" width="2" height="16" fill="#d0a878"/>
  <rect x="32" y="4" width="2" height="16" fill="#d0a878"/>
  <!-- Hair - short disheveled -->
  <rect x="14" y="4" width="20" height="5" fill="#5a3818"/>
  <rect x="12" y="6" width="3" height="3" fill="#5a3818"/>
  <rect x="33" y="5" width="3" height="3" fill="#5a3818"/>
  <!-- Messy hair strands -->
  <rect x="20" y="3" width="3" height="3" fill="#6a4828"/>
  <rect x="27" y="4" width="2" height="3" fill="#6a4828"/>
  <!-- ANGRY eyes - wide, stressed -->
  <rect x="16" y="11" width="6" height="5" fill="#ffffff"/>
  <rect x="26" y="11" width="6" height="5" fill="#ffffff"/>
  <rect x="17" y="12" width="4" height="3" fill="#3a2010"/>
  <rect x="27" y="12" width="4" height="3" fill="#3a2010"/>
  <rect x="18" y="13" width="2" height="1" fill="#ffffff"/>
  <rect x="28" y="13" width="2" height="1" fill="#ffffff"/>
  <!-- Angry V-shaped brows -->
  <rect x="16" y="10" width="7" height="1" fill="#3a2010"/>
  <rect x="25" y="10" width="7" height="1" fill="#3a2010"/>
  <rect x="16" y="9" width="2" height="2" fill="#3a2010"/>
  <rect x="30" y="9" width="2" height="2" fill="#3a2010"/>
  <rect x="18" y="10" width="2" height="2" fill="#5a3010"/>
  <rect x="28" y="10" width="2" height="2" fill="#5a3010"/>
  <!-- Frustrated expression - mouth open, yelling -->
  <rect x="17" y="18" width="14" height="4" fill="#8a4030"/>
  <rect x="18" y="18" width="12" height="3" fill="#c06040"/>
  <!-- Teeth showing -->
  <rect x="19" y="18" width="10" height="1" fill="#f0e0d0"/>
  <rect x="19" y="21" width="10" height="1" fill="#f0e0d0"/>
  <!-- Tongue -->
  <rect x="21" y="19" width="6" height="2" fill="#e06050"/>
  <!-- Stress lines on forehead -->
  <rect x="18" y="8" width="4" height="1" fill="#c89868" opacity="0.6"/>
  <rect x="26" y="8" width="4" height="1" fill="#c89868" opacity="0.6"/>
  <rect x="20" y="7" width="8" height="1" fill="#c89868" opacity="0.4"/>
</svg>
