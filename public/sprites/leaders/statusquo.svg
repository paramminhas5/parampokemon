<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Dark regal background -->
  <rect width="48" height="64" fill="#0a0810"/>
  <!-- Background glow aura -->
  <rect x="8" y="2" width="32" height="60" fill="#1a1428" opacity="0.8"/>
  <!-- Golden floor glow under feet -->
  <rect x="10" y="58" width="28" height="4" fill="#f5d24a" opacity="0.2"/>
  <!-- WIDE BATTLE STANCE - feet spread apart -->
  <!-- Left boot -->
  <rect x="6" y="56" width="10" height="6" fill="#2a2a3a"/>
  <rect x="5" y="58" width="12" height="4" fill="#1a1a28"/>
  <rect x="6" y="56" width="10" height="2" fill="#3a3a4a"/>
  <!-- Right boot -->
  <rect x="32" y="56" width="10" height="6" fill="#2a2a3a"/>
  <rect x="31" y="58" width="12" height="4" fill="#1a1a28"/>
  <rect x="32" y="56" width="10" height="2" fill="#3a3a4a"/>
  <!-- Boot buckles - gold -->
  <rect x="8" y="57" width="4" height="2" fill="#f5d24a"/>
  <rect x="36" y="57" width="4" height="2" fill="#f5d24a"/>
  <!-- Left greave/leg armor -->
  <rect x="8" y="46" width="8" height="12" fill="#4a4a5a"/>
  <rect x="8" y="46" width="2" height="12" fill="#5a5a6a"/>
  <rect x="14" y="46" width="2" height="12" fill="#3a3a4a"/>
  <!-- Knee guard -->
  <rect x="7" y="50" width="10" height="4" fill="#3a3a4a"/>
  <rect x="8" y="50" width="8" height="2" fill="#5a5a6a"/>
  <!-- Right greave -->
  <rect x="32" y="46" width="8" height="12" fill="#4a4a5a"/>
  <rect x="32" y="46" width="2" height="12" fill="#5a5a6a"/>
  <rect x="38" y="46" width="2" height="12" fill="#3a3a4a"/>
  <!-- Knee guard right -->
  <rect x="31" y="50" width="10" height="4" fill="#3a3a4a"/>
  <rect x="32" y="50" width="8" height="2" fill="#5a5a6a"/>
  <!-- DEEP CRIMSON CAPE flowing behind - wide and dramatic -->
  <!-- Cape shadow/depth -->
  <rect x="4" y="20" width="40" height="44" fill="#8a1010" opacity="0.5"/>
  <!-- Cape main body -->
  <rect x="6" y="18" width="36" height="44" fill="#c03030"/>
  <!-- Cape shading -->
  <rect x="6" y="18" width="4" height="44" fill="#d04040"/>
  <rect x="38" y="18" width="4" height="44" fill="#9a1818"/>
  <!-- Cape inner (darker) -->
  <rect x="10" y="20" width="28" height="40" fill="#a02020"/>
  <!-- Cape fold highlights -->
  <rect x="14" y="22" width="2" height="36" fill="#c83030" opacity="0.7"/>
  <rect x="28" y="24" width="2" height="34" fill="#c83030" opacity="0.5"/>
  <rect x="36" y="26" width="2" height="28" fill="#d84040" opacity="0.4"/>
  <!-- DARK STEEL PLATE ARMOR - torso -->
  <rect x="12" y="22" width="24" height="26" fill="#4a4a5a"/>
  <!-- Armor highlights -->
  <rect x="12" y="22" width="3" height="26" fill="#5a5a6a"/>
  <rect x="33" y="22" width="3" height="26" fill="#3a3a4a"/>
  <!-- Chest armor plate detail -->
  <rect x="15" y="24" width="18" height="12" fill="#52526a"/>
  <rect x="15" y="24" width="18" height="2" fill="#6a6a7a"/>
  <!-- Breastplate center ridge -->
  <rect x="23" y="24" width="2" height="12" fill="#3a3a4a"/>
  <!-- Shoulder pauldrons - wide -->
  <rect x="8" y="20" width="8" height="10" fill="#3a3a4a"/>
  <rect x="32" y="20" width="8" height="10" fill="#3a3a4a"/>
  <!-- Pauldron highlights -->
  <rect x="8" y="20" width="8" height="2" fill="#5a5a6a"/>
  <rect x="32" y="20" width="8" height="2" fill="#5a5a6a"/>
  <!-- Pauldron gold trim -->
  <rect x="8" y="28" width="8" height="2" fill="#f5d24a"/>
  <rect x="32" y="28" width="8" height="2" fill="#f5d24a"/>
  <!-- Armor gold trim lines -->
  <rect x="12" y="22" width="24" height="2" fill="#f5d24a"/>
  <rect x="12" y="36" width="24" height="2" fill="#f5d24a"/>
  <rect x="12" y="46" width="24" height="2" fill="#f5d24a"/>
  <!-- Gorget/neck armor -->
  <rect x="18" y="18" width="12" height="6" fill="#4a4a5a"/>
  <rect x="18" y="18" width="12" height="2" fill="#5a5a6a"/>
  <!-- Left gauntlet arm -->
  <rect x="4" y="28" width="8" height="6" fill="#3a3a4a"/>
  <rect x="4" y="28" width="8" height="2" fill="#5a5a6a"/>
  <!-- Left fist -->
  <rect x="2" y="34" width="10" height="8" fill="#3a3a4a"/>
  <rect x="2" y="34" width="10" height="2" fill="#5a5a6a"/>
  <!-- Right arm - holding GOLDEN SCEPTER -->
  <rect x="36" y="28" width="8" height="6" fill="#3a3a4a"/>
  <rect x="36" y="28" width="8" height="2" fill="#5a5a6a"/>
  <rect x="36" y="34" width="8" height="8" fill="#3a3a4a"/>
  <!-- GOLDEN SCEPTER -->
  <rect x="44" y="8" width="4" height="48" fill="#c8a000"/>
  <rect x="44" y="8" width="2" height="48" fill="#f5d24a"/>
  <!-- Scepter orb top -->
  <rect x="42" y="6" width="8" height="8" fill="#f5d24a"/>
  <rect x="43" y="5" width="6" height="2" fill="#f5d24a"/>
  <rect x="44" y="4" width="4" height="2" fill="#f0c030"/>
  <rect x="43" y="6" width="6" height="6" fill="#ffd840"/>
  <rect x="44" y="7" width="4" height="4" fill="#fff070"/>
  <!-- Scepter gems -->
  <rect x="43" y="8" width="2" height="2" fill="#ff6080"/>
  <rect x="47" y="8" width="2" height="2" fill="#6080ff"/>
  <!-- Scepter base flourish -->
  <rect x="42" y="52" width="8" height="3" fill="#f5d24a"/>
  <rect x="43" y="55" width="6" height="2" fill="#c8a000"/>
  <!-- Neck -->
  <rect x="20" y="12" width="8" height="8" fill="#d4a878"/>
  <!-- HEAD - powerful, imposing face -->
  <rect x="14" y="2" width="20" height="14" fill="#d4a878"/>
  <!-- Head shading -->
  <rect x="14" y="2" width="2" height="14" fill="#c49868"/>
  <rect x="32" y="2" width="2" height="14" fill="#c49868"/>
  <!-- THREE-SPIKE GOLD CROWN - prominent -->
  <!-- Crown base -->
  <rect x="12" y="0" width="24" height="5" fill="#f5d24a"/>
  <!-- Crown spikes - 3 prominent spikes -->
  <!-- Left spike -->
  <rect x="12" y="-2" width="5" height="4" fill="#f5d24a"/>
  <rect x="13" y="-4" width="3" height="4" fill="#ffd840"/>
  <rect x="14" y="-5" width="1" height="2" fill="#fff070"/>
  <!-- Center spike - tallest -->
  <rect x="21" y="-4" width="6" height="6" fill="#f5d24a"/>
  <rect x="22" y="-6" width="4" height="4" fill="#ffd840"/>
  <rect x="23" y="-8" width="2" height="4" fill="#fff070"/>
  <!-- Right spike -->
  <rect x="31" y="-2" width="5" height="4" fill="#f5d24a"/>
  <rect x="32" y="-4" width="3" height="4" fill="#ffd840"/>
  <rect x="33" y="-5" width="1" height="2" fill="#fff070"/>
  <!-- Crown gems -->
  <rect x="15" y="1" width="2" height="2" fill="#c03030"/>
  <rect x="22" y="0" width="4" height="3" fill="#c03030"/>
  <rect x="31" y="1" width="2" height="2" fill="#c03030"/>
  <!-- Crown highlight band -->
  <rect x="12" y="3" width="24" height="1" fill="#ffd840"/>
  <!-- STRONG battle face -->
  <!-- Eyes - intense, powerful, wide -->
  <rect x="16" y="7" width="6" height="5" fill="#ffffff"/>
  <rect x="26" y="7" width="6" height="5" fill="#ffffff"/>
  <rect x="17" y="8" width="4" height="3" fill="#1a1a3a"/>
  <rect x="27" y="8" width="4" height="3" fill="#1a1a3a"/>
  <rect x="17" y="8" width="2" height="2" fill="#2a2a5a"/>
  <rect x="27" y="8" width="2" height="2" fill="#2a2a5a"/>
  <rect x="17" y="8" width="1" height="1" fill="#ffffff"/>
  <rect x="27" y="8" width="1" height="1" fill="#ffffff"/>
  <!-- Battle-hardened brows - thick and stern -->
  <rect x="15" y="6" width="8" height="2" fill="#3a2010"/>
  <rect x="25" y="6" width="8" height="2" fill="#3a2010"/>
  <rect x="15" y="5" width="3" height="2" fill="#3a2010"/>
  <rect x="30" y="5" width="3" height="2" fill="#3a2010"/>
  <!-- Strong jaw/chin structure -->
  <rect x="14" y="13" width="20" height="3" fill="#c49868"/>
  <!-- Battle scar -->
  <rect x="31" y="8" width="1" height="4" fill="#a87848"/>
  <!-- Firm, determined mouth -->
  <rect x="19" y="13" width="10" height="2" fill="#9a6848"/>
  <rect x="18" y="14" width="2" height="1" fill="#9a6848"/>
  <rect x="29" y="14" width="1" height="1" fill="#b07858"/>
  <!-- Beard shadow - veteran warrior -->
  <rect x="16" y="13" width="16" height="3" fill="#a87848" opacity="0.5"/>
</svg>
