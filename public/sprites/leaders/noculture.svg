<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64" shape-rendering="crispEdges">
  <!-- Urban background -->
  <rect width="48" height="64" fill="#2a2030"/>
  <!-- White sneakers -->
  <rect x="14" y="58" width="8" height="4" fill="#f0f0f0"/>
  <rect x="26" y="58" width="8" height="4" fill="#f0f0f0"/>
  <!-- Sneaker sole -->
  <rect x="14" y="60" width="8" height="2" fill="#d0d0d0"/>
  <rect x="26" y="60" width="8" height="2" fill="#d0d0d0"/>
  <!-- Sneaker details -->
  <rect x="15" y="58" width="4" height="1" fill="#ff9fd4"/>
  <rect x="27" y="58" width="4" height="1" fill="#ff9fd4"/>
  <!-- Dark pants -->
  <rect x="15" y="46" width="7" height="14" fill="#1a1a2a"/>
  <rect x="26" y="46" width="7" height="14" fill="#1a1a2a"/>
  <!-- Pants highlight -->
  <rect x="16" y="46" width="2" height="14" fill="#2a2a3a"/>
  <!-- Oversized hot pink hoodie - wide body -->
  <rect x="8" y="24" width="32" height="24" fill="#ff9fd4"/>
  <!-- Hoodie shading -->
  <rect x="8" y="24" width="3" height="24" fill="#ff80b8"/>
  <rect x="37" y="24" width="3" height="24" fill="#e87ab0"/>
  <!-- Hoodie kangaroo pocket -->
  <rect x="16" y="36" width="16" height="10" fill="#e87ab0"/>
  <rect x="17" y="37" width="14" height="8" fill="#ff9fd4"/>
  <!-- Hoodie front zipper line -->
  <rect x="23" y="24" width="2" height="14" fill="#e87ab0"/>
  <!-- Arms crossed - both going across chest area -->
  <!-- Left arm going right across body -->
  <rect x="4" y="28" width="20" height="8" fill="#ff9fd4"/>
  <rect x="4" y="28" width="3" height="8" fill="#ff80b8"/>
  <!-- Left hand -->
  <rect x="4" y="28" width="4" height="8" fill="#d4a878"/>
  <!-- Right arm going left across body -->
  <rect x="24" y="32" width="20" height="8" fill="#ff9fd4"/>
  <rect x="40" y="32" width="4" height="8" fill="#ff80b8"/>
  <!-- Right hand -->
  <rect x="40" y="32" width="4" height="8" fill="#d4a878"/>
  <!-- Gold chain -->
  <rect x="18" y="28" width="12" height="2" fill="#f0c030"/>
  <rect x="17" y="30" width="2" height="2" fill="#f0c030"/>
  <rect x="29" y="30" width="2" height="2" fill="#f0c030"/>
  <rect x="22" y="32" width="4" height="3" fill="#d4a000"/>
  <!-- Chain links detail -->
  <rect x="19" y="29" width="2" height="1" fill="#d4a000"/>
  <rect x="22" y="29" width="2" height="1" fill="#d4a000"/>
  <rect x="25" y="29" width="2" height="1" fill="#d4a000"/>
  <rect x="28" y="29" width="2" height="1" fill="#d4a000"/>
  <!-- Neck -->
  <rect x="20" y="18" width="8" height="8" fill="#d4a878"/>
  <!-- Head -->
  <rect x="14" y="6" width="20" height="16" fill="#d4a878"/>
  <!-- Head shading -->
  <rect x="14" y="6" width="2" height="16" fill="#c49868"/>
  <rect x="32" y="6" width="2" height="16" fill="#c49868"/>
  <!-- Cap - hot pink matching hoodie, brim forward -->
  <rect x="12" y="4" width="24" height="6" fill="#ff9fd4"/>
  <!-- Cap brim -->
  <rect x="10" y="8" width="28" height="3" fill="#e87ab0"/>
  <!-- Cap highlight -->
  <rect x="14" y="4" width="8" height="2" fill="#ffb8e0"/>
  <!-- Cap snapback detail -->
  <rect x="20" y="4" width="8" height="2" fill="#e87ab0"/>
  <!-- Eyes - skeptical/bored -->
  <rect x="17" y="12" width="5" height="4" fill="#ffffff"/>
  <rect x="26" y="12" width="5" height="4" fill="#ffffff"/>
  <rect x="18" y="13" width="3" height="2" fill="#3a2010"/>
  <rect x="27" y="13" width="3" height="2" fill="#3a2010"/>
  <rect x="19" y="13" width="1" height="1" fill="#ffffff"/>
  <rect x="28" y="13" width="1" height="1" fill="#ffffff"/>
  <!-- Half-lidded skeptical brows -->
  <rect x="17" y="11" width="6" height="2" fill="#3a2010"/>
  <rect x="26" y="11" width="6" height="2" fill="#3a2010"/>
  <rect x="17" y="12" width="2" height="1" fill="#5a3010"/>
  <rect x="30" y="12" width="2" height="1" fill="#5a3010"/>
  <!-- Unimpressed mouth - slight frown -->
  <rect x="19" y="19" width="10" height="2" fill="#a07858"/>
  <rect x="18" y="20" width="2" height="1" fill="#a07858"/>
  <rect x="29" y="20" width="1" height="1" fill="#a07858"/>
  <!-- Earring -->
  <rect x="13" y="14" width="2" height="3" fill="#f0c030"/>
  <rect x="13" y="17" width="2" height="2" fill="#d4a000"/>
</svg>
